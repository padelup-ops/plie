<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<style>
/* Film du guide, thème terminal : 1080×1920. Tout est en animations CSS mises en pause, que frames.js place à
   l'instant voulu (window.seek) ; la pluie de code est redessinée pour cet instant, toujours la même à instant égal. */
:root { --bg:#020604; --panel:#05100A; --fg:#A9E6B8; --bright:#00FF66; --white:#E8FFEC; --dim:#5C9E72; --line:#134229; --amber:#FFB454; }
* { box-sizing:border-box; margin:0; }
html, body { width:1080px; height:1920px; overflow:hidden; background:var(--bg); color:var(--fg); font-family:"DejaVu Sans Mono", monospace; }
#rain { position:absolute; inset:0; opacity:.95; animation: rain-dim 1.3s ease 1.1s both, rain-up .8s ease 32.3s forwards; }
@keyframes rain-dim { from { opacity:.95 } to { opacity:.4 } }
@keyframes rain-up { from { opacity:.4 } to { opacity:.5 } }
.lines { position:absolute; inset:0; background:repeating-linear-gradient(0deg, rgba(0,0,0,.2) 0 2px, transparent 2px 6px); z-index:9; }
.scene { position:absolute; inset:0; padding:150px 80px; display:flex; flex-direction:column; justify-content:center; gap:44px; opacity:0;
  animation: s-in .3s steps(3) var(--at) both, s-out .25s steps(3) calc(var(--at) + var(--dur) - .25s) forwards; }
.scene.last { animation: s-in .3s steps(3) var(--at) both; }
@keyframes s-in { from { opacity:0 } to { opacity:1 } }
@keyframes s-out { from { opacity:1 } to { opacity:0 } }
.pop { opacity:0; animation: pop .35s steps(4) calc(var(--at) + var(--d, 0s)) both; }
@keyframes pop { from { opacity:0; transform:translateY(24px) } to { opacity:1; transform:none } }
.zoom { opacity:0; animation: zoom .2s steps(2) calc(var(--at) + var(--d, 0s)) both; }
@keyframes zoom { from { opacity:0 } to { opacity:1 } }
h1, h2 { font-weight:700; color:var(--white); text-shadow:0 0 34px rgba(0,255,102,.6); letter-spacing:-.045em; }
h1 { font-size:98px; line-height:1.04; }
h2 { font-size:74px; line-height:1.08; }
h1 em, h2 em { font-style:normal; color:var(--bright); }
.eyebrow { font-size:32px; letter-spacing:.08em; text-transform:uppercase; color:var(--bright); }
.sub { font-size:38px; line-height:1.35; color:var(--fg); }
.small { font-size:24px; line-height:1.45; color:var(--dim); }
.veil { background:rgba(2,6,4,.82); border:2px solid var(--line); padding:54px 48px; display:flex; flex-direction:column; gap:36px; }

.card { background:var(--panel); color:var(--white); border:2px solid var(--bright); box-shadow:0 0 60px rgba(0,255,102,.16); padding:48px; display:flex; flex-direction:column; gap:30px; min-height:380px; justify-content:center; }
.row { display:flex; align-items:center; justify-content:space-between; gap:20px; font-size:40px; font-weight:700; }
.chip { font-size:32px; font-weight:700; color:var(--bright); white-space:nowrap; }
.chip::before { content:"[ "; color:var(--dim); } .chip::after { content:" ]"; color:var(--dim); }
.mono { font-size:38px; font-weight:700; color:var(--bright); border:2px dashed var(--line); padding:24px 26px; }
.lab { font-size:28px; color:var(--dim); }
.lab::before { content:"// "; }
.digits { display:flex; gap:16px; justify-content:center; }
.digits b { width:122px; height:150px; border:2px solid var(--bright); display:grid; place-items:center; font-size:76px; color:var(--bright); }
.tiles { display:grid; grid-template-columns:repeat(3, 1fr); gap:22px; }
.tiles i { aspect-ratio:1; display:block; border:2px solid var(--bright); position:relative; overflow:hidden; }
.tiles i::after { content:""; position:absolute; inset:auto 0 0 0; height:44%; background:var(--bright); opacity:var(--o, .5); }
.tiles i::before { content:""; position:absolute; width:22%; aspect-ratio:1; background:var(--white); top:16%; right:16%; }
.dots { position:absolute; left:0; right:0; bottom:150px; display:flex; gap:18px; justify-content:center; opacity:0;
  animation: s-in .3s steps(3) 8.75s both, s-out .3s steps(3) 28.45s forwards; }
.dots i { width:30px; height:14px; background:var(--line); animation: dot .2s steps(1) var(--on) both; }
@keyframes dot { to { background:var(--bright) } }
.price { font-weight:700; font-size:170px; letter-spacing:-.06em; line-height:1; color:var(--bright); text-shadow:0 0 50px rgba(0,255,102,.7); }
</style></head>
<body>
<canvas id="rain" width="1080" height="1920"></canvas>
<div id="stage"></div>
<div class="lines"></div>
<script>
const STEP = 2.5, STEPS_AT = 8.75;
const ok = (txt, d) => `<span class="chip zoom" style="--d:${d}s">${txt}</span>`;
const steps = [
  ["Récupère l'identifiant de ton appareil", `<span class="lab pop" style="--d:.45s">identifiant (UDID)</span><div class="mono pop" style="--d:.6s">00008160-000A1B2C…</div><div class="row"><span></span>${ok("copié", 1.25)}</div>`],
  ["Installe les deux apps", `<div class="row pop" style="--d:.45s"><span>StikDebug</span>${ok("installée", 1.05)}</div><div class="row pop" style="--d:.65s"><span>Émulateur</span>${ok("installée", 1.45)}</div>`],
  ["Active le Mode développeur", `<span class="lab pop" style="--d:.45s">Réglages › Confidentialité et sécurité</span><div class="row pop" style="--d:.6s"><span>Mode développeur</span>${ok("ON", 1.1)}</div>`],
  ["Connecte LocalDevVPN", `<div class="row pop" style="--d:.45s"><span>LocalDevVPN</span>${ok("connecté", 1.05)}</div><span class="lab pop" style="--d:.75s">gratuit, sur l'App Store</span>`],
  ["Appaire StikDebug", `<span class="lab pop" style="--d:.45s">code à saisir dans Réglages</span><div class="digits">${"482913".split("").map((c, i) => `<b class="zoom" style="--d:${.65 + i * .16}s">${c}</b>`).join("")}</div>`],
  ["Active le JIT", `<div class="row pop" style="--d:.45s"><span>MeloNX</span>${ok("JIT actif", 1.05)}</div><span class="lab pop" style="--d:.75s">à refaire à chaque partie</span>`],
  ["Importe tes clés et ton firmware", `<div class="row pop" style="--d:.45s"><span>prod.keys</span>${ok("importé", 1.0)}</div><div class="row pop" style="--d:.65s"><span>firmware.zip</span>${ok("importé", 1.4)}</div>`],
  ["Ajoute tes jeux", `<div class="tiles">${[.9, .35, .6, .45, .8, .25].map((o, i) => `<i class="zoom" style="--d:${.5 + i * .14}s;--o:${o}"></i>`).join("")}</div>`],
];
let html = `
<section class="scene" style="--at:0s;--dur:5s"><div class="veil pop" style="--d:1.3s">
  <p class="eyebrow pop" style="--d:1.5s">&gt; connexion établie</p>
  <h1 class="pop" style="--d:1.8s">L'émulateur Switch sur <em>iPhone et iPad.</em></h1></div>
</section>
<section class="scene" style="--at:5s;--dur:3.75s">
  <h1 class="pop" style="--d:.3s">Sans ordinateur.</h1>
  <h1 class="pop" style="--d:1.1s"><em>Sans jailbreak.</em></h1>
  <p class="sub pop" style="--d:1.9s">Tout se fait depuis l'appareil, en 8 étapes.</p>
</section>`;
steps.forEach(([title, mock], i) => {
  html += `<section class="scene" style="--at:${STEPS_AT + i * STEP}s;--dur:${STEP}s">
    <p class="eyebrow pop" style="--d:.1s">étape 0${i + 1} / 08</p>
    <h2 class="pop" style="--d:.2s">${title}</h2>
    <div class="card pop" style="--d:.35s">${mock}</div></section>`;
});
html += `
<section class="scene" style="--at:28.75s;--dur:3.75s">
  <h1 class="pop" style="--d:.3s">Tes clés.</h1><h1 class="pop" style="--d:.8s">Ton firmware.</h1><h1 class="pop" style="--d:1.3s"><em>Tes jeux.</em></h1>
  <p class="sub pop" style="--d:2s">Rien n'est fourni : tu utilises les fichiers de ta propre console.</p>
</section>
<section class="scene last" style="--at:32.5s;--dur:7s"><div class="veil pop" style="--d:.2s">
  <p class="eyebrow pop" style="--d:.4s">&gt; accès complet</p>
  <h2 class="pop" style="--d:.6s">Le guide, <em>pas à pas.</em></h2>
  <p class="sub pop" style="--d:.9s">8 étapes · dépannage · assistant<br>iPhone et iPad</p>
  <p class="price zoom" style="--d:1.4s">9,90 €</p>
  <p class="small pop" style="--d:2s">Émulation expérimentale : tous les jeux ne tournent pas. MeloNX et StikDebug sont des logiciels libres (AGPL v3). Site non affilié à Nintendo ni à Apple.</p></div>
</section>
<div class="dots">${steps.map((_, i) => `<i style="--on:${STEPS_AT + i * STEP + .15}s"></i>`).join("")}</div>`;
document.getElementById("stage").innerHTML = html;

// La pluie : chaque colonne a sa vitesse et sa longueur, tirées d'une suite fixe.
const cx = document.getElementById("rain").getContext("2d");
const G = "ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜﾝ0123456789";
const SZ = 30, COLS = 36, ROWS = 64;
const rnd = a => { const x = Math.sin(a * 127.1 + 11.7) * 43758.5453; return x - Math.floor(x); };
function rain(t) {
  cx.fillStyle = "#020604"; cx.fillRect(0, 0, 1080, 1920);
  cx.font = '26px "DejaVu Sans Mono", "WenQuanYi Zen Hei", monospace';
  for (let c = 0; c < COLS; c++) {
    for (let s = 0; s < 2; s++) {                       // deux traînées par colonne
      const k0 = c * 2 + s, speed = 7 + rnd(k0 + 1) * 11, len = 9 + Math.floor(rnd(k0 + 50) * 20), cycle = ROWS + len + Math.floor(rnd(k0 + 90) * 40);
      const head = Math.floor((t * speed + rnd(k0 + 7) * cycle) % cycle);
      for (let k = 0; k < len; k++) {
        const r = head - k;
        if (r < 0 || r >= ROWS) continue;
        const g = G[Math.floor(rnd(c * 131 + r * 17 + Math.floor(t * 3 + rnd(c * 3 + r) * 3)) * G.length)];
        cx.fillStyle = k === 0 ? "rgba(232,255,236,1)" : `rgba(0,255,102,${(1 - k / len) * 0.8})`;
        cx.fillText(g, c * SZ, (r + 1) * SZ);
      }
    }
  }
}
document.fonts.ready.then(() => {
  const anims = document.getAnimations();
  anims.forEach(a => a.pause());
  window.seek = t => { anims.forEach(a => { a.currentTime = t * 1000; }); rain(t); };
  window.seek(0);
  window.ready = true;
});
</script>
</body></html>
