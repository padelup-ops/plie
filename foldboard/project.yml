# FOLDBOARD : le clavier pour l'iPhone Duo. Une app (installation, réglages, essai) et une extension clavier.
# Projet généré par XcodeGen : `xcodegen generate` dans ce dossier.
# Réglages et accès Pro : trousseau partagé, et groupe d'app group.com.padelup.foldboard (lu à chaque apparition du clavier).
name: Foldboard
options:
  bundleIdPrefix: com.padelup
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: 1.0.28
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    LOCALIZATION_PREFERS_STRING_CATALOGS: NO
    # Le glisser neuronal (ExecuTorch 1.6, téléchargé par tools/fetch_executorch.sh avant la compilation).
    SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) FOLDBOARD_NEURAL"
    "OTHER_SWIFT_FLAGS[sdk=iphoneos*]": "$(inherited) -I $(SRCROOT)/Vendor/executorch.xcframework/ios-arm64/Headers"
    "OTHER_SWIFT_FLAGS[sdk=iphonesimulator*]": "$(inherited) -I $(SRCROOT)/Vendor/executorch.xcframework/ios-arm64-simulator/Headers"
    "OTHER_LDFLAGS[sdk=iphoneos*]": "$(inherited) -lc++ -lsqlite3 -framework Accelerate -framework CoreML -framework CoreGraphics -framework CoreImage -framework CoreVideo -Xlinker -force_load -Xlinker $(SRCROOT)/Vendor/executorch.xcframework/ios-arm64/libexecutorch_ios.a -Xlinker -force_load -Xlinker $(SRCROOT)/Vendor/backend_xnnpack.xcframework/ios-arm64/libbackend_xnnpack_ios.a -Xlinker -force_load -Xlinker $(SRCROOT)/Vendor/kernels_optimized.xcframework/ios-arm64/libkernels_optimized_ios.a -Xlinker -force_load -Xlinker $(SRCROOT)/Vendor/kleidiai.xcframework/ios-arm64/libkleidiai_ios.a -Xlinker -force_load -Xlinker $(SRCROOT)/Vendor/threadpool.xcframework/ios-arm64/libthreadpool_ios.a"
    "OTHER_LDFLAGS[sdk=iphonesimulator*]": "$(inherited) -lc++ -lsqlite3 -framework Accelerate -framework CoreML -framework CoreGraphics -framework CoreImage -framework CoreVideo -Xlinker -force_load -Xlinker $(SRCROOT)/Vendor/executorch.xcframework/ios-arm64-simulator/libexecutorch_simulator.a -Xlinker -force_load -Xlinker $(SRCROOT)/Vendor/backend_xnnpack.xcframework/ios-arm64-simulator/libbackend_xnnpack_simulator.a -Xlinker -force_load -Xlinker $(SRCROOT)/Vendor/kernels_optimized.xcframework/ios-arm64-simulator/libkernels_optimized_simulator.a -Xlinker -force_load -Xlinker $(SRCROOT)/Vendor/kleidiai.xcframework/ios-arm64-simulator/libkleidiai_simulator.a -Xlinker -force_load -Xlinker $(SRCROOT)/Vendor/threadpool.xcframework/ios-arm64-simulator/libthreadpool_simulator.a"
# La dictée Parakeet (FluidAudio, Apache 2.0) : dans l'app seulement, jamais dans le clavier (mémoire limitée).
packages:
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio.git
    exactVersion: 0.18.3
targets:
  Foldboard:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
        excludes:
          - "FUTO/**"
      - path: Shared/FUTO
        buildPhase: resources
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Foldboard
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, fr, de, es, ja, ko, zh-Hans, it, pt-BR, nl, ru]
        CFBundleAllowMixedLocalizations: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        ITSAppUsesNonExemptEncryption: false
        FoldboardKeychainGroup: $(DEVELOPMENT_TEAM).com.padelup.foldboard.shared
        FoldboardAppGroup: group.com.padelup.foldboard
        # La dictée : le clavier ouvre l'app (foldboard://dictate), qui garde le micro pour lui en arrière-plan.
        CFBundleURLTypes:
          - CFBundleURLName: com.padelup.foldboard
            CFBundleURLSchemes: [foldboard]
        UIBackgroundModes: [audio]
        NSMicrophoneUsageDescription: "Foldboard uses the microphone only when you dictate from the keyboard. Your voice is transcribed on your iPhone and never sent."
        NSSpeechRecognitionUsageDescription: "Your dictation is transcribed on your iPhone. Nothing is sent or kept."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.padelup.foldboard
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: App/Foldboard.entitlements
    dependencies:
      - target: FoldboardKeyboard
        embed: true
      - package: FluidAudio
        product: FluidAudio
    scheme: {}
  FoldboardKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: Keyboard
      - path: Shared
        excludes:
          - "FUTO/**"
      - path: Shared/FUTO
        buildPhase: resources
    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleDisplayName: Foldboard
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, fr, de, es, ja, ko, zh-Hans, it, pt-BR, nl, ru]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: mul
            RequestsOpenAccess: true
        NSMicrophoneUsageDescription: "Foldboard uses the microphone only when you dictate. Your voice is transcribed on your iPhone and never sent."
        NSSpeechRecognitionUsageDescription: "Your dictation is transcribed on your iPhone. Nothing is sent or kept."
        FoldboardKeychainGroup: $(DEVELOPMENT_TEAM).com.padelup.foldboard.shared
        FoldboardAppGroup: group.com.padelup.foldboard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.padelup.foldboard.keyboard
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: Keyboard/FoldboardKeyboard.entitlements
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
