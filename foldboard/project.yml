# FOLDBOARD : le clavier pour l'iPhone Duo. Une app (installation, réglages, essai) et une extension clavier.
# Projet généré par XcodeGen : `xcodegen generate` dans ce dossier.
# Réglages et accès Pro partagés dans un groupe de trousseau (pas de groupe d'app à déclarer chez Apple).
name: Foldboard
options:
  bundleIdPrefix: com.padelup
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: 1.0.14
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    LOCALIZATION_PREFERS_STRING_CATALOGS: NO
targets:
  Foldboard:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Foldboard
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, fr, de, es, ja, ko, zh-Hans, it, pt-BR, nl, ru]
        CFBundleAllowMixedLocalizations: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        ITSAppUsesNonExemptEncryption: false
        FoldboardKeychainGroup: $(DEVELOPMENT_TEAM).com.padelup.foldboard.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.padelup.foldboard
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: App/Foldboard.entitlements
    dependencies:
      - target: FoldboardKeyboard
        embed: true
    scheme: {}
  FoldboardKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: Keyboard
      - path: Shared
    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleDisplayName: Foldboard
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, fr, de, es, ja, ko, zh-Hans, it, pt-BR, nl, ru]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: mul
            RequestsOpenAccess: true
        FoldboardKeychainGroup: $(DEVELOPMENT_TEAM).com.padelup.foldboard.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.padelup.foldboard.keyboard
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: Keyboard/FoldboardKeyboard.entitlements
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
