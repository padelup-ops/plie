<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1024px;height:1024px;overflow:hidden}
.bg{position:absolute;inset:0;background:radial-gradient(800px 700px at 75% 20%,#2c5bea 0%,rgba(44,91,234,0) 60%),linear-gradient(155deg,#16205a 0%,#070a1f 100%)}
.k{position:absolute;border-radius:120px;width:420px;height:420px;top:300px}
.g1{left:150px;background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 4px rgba(255,255,255,.10)}
.g2{left:250px;background:rgba(255,255,255,.14);box-shadow:inset 0 0 0 4px rgba(255,255,255,.14)}
.main{left:370px;background:linear-gradient(160deg,#ffffff 0%,#e7ecf7 100%);box-shadow:0 30px 60px rgba(0,0,0,.45),inset 0 -16px 0 rgba(20,40,110,.10)}
.dot{position:absolute;left:50%;top:50%;width:150px;height:22px;border-radius:11px;transform:translate(-50%,40px);background:linear-gradient(90deg,#2f7cf6,#53e3b0)}
svg{position:absolute;inset:0}
</style></head><body><div class="bg"></div>
<div class="k g1"></div><div class="k g2"></div><div class="k main"><div class="dot"></div></div>
<svg viewBox="0 0 1024 1024"><defs><linearGradient id="a" x1="0" x2="1"><stop offset="0" stop-color="#53e3b0" stop-opacity="0"/><stop offset="1" stop-color="#53e3b0"/></linearGradient></defs>
<path d="M 300 860 Q 640 980 880 760" fill="none" stroke="url(#a)" stroke-width="26" stroke-linecap="round"/></svg>
</body></html>
