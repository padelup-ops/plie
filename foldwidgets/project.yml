# FOLD WIDGETS : six thèmes pour l'iPhone Duo, un widget, une paire de fonds d'écran.
# Projet généré par XcodeGen : `xcodegen generate` dans ce dossier.
# Identifiants alignés sur les autres apps du dépôt (com.padelup), pas sur app.foldwidgets.
# L'équipe de signature vient du secret APPLE_TEAM_ID au moment du build : on ne la grave pas ici.
name: FoldWidgets
options:
  bundleIdPrefix: com.padelup
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    LOCALIZATION_PREFERS_STRING_CATALOGS: NO
targets:
  FoldWidgets:
    type: application
    platform: iOS
    sources:
      - path: FoldWidgets
      - path: Shared
    info:
      path: FoldWidgets/Info.plist
      properties:
        CFBundleDisplayName: Fold Widgets
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, fr]
        CFBundleAllowMixedLocalizations: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        NSPhotoLibraryAddUsageDescription: "Fold Widgets saves the wallpaper pair and the share card into your photo library. Nothing leaves your iPhone."
        FoldWidgetsAppGroup: group.com.padelup.foldwidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.padelup.foldwidgets
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: FoldWidgets/FoldWidgets.entitlements
        # onHingeChange et reservedRegions (iOS 27.1). Le workflow retire ce drapeau
        # si le Mac n'a pas Xcode 27.1 : l'app compile alors sans la charnière.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DUO_SDK"
    dependencies:
      - target: FoldWidgetsWidget
        embed: true
    scheme: {}
  FoldWidgetsWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: FoldWidgetsWidget
      - path: Shared
    info:
      path: FoldWidgetsWidget/Info.plist
      properties:
        CFBundleDisplayName: Fold Widgets
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, fr]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        FoldWidgetsAppGroup: group.com.padelup.foldwidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.padelup.foldwidgets.widget
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: FoldWidgetsWidget/FoldWidgetsWidget.entitlements
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
