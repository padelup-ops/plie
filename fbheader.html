<!doctype html>
<html><head><meta charset="utf-8">

<style>
  .hd{position:absolute;opacity:1}

  .tall .hd{left:0;right:0;top:40px;text-align:center}

<style>
  html,body{background:#070a1f}
  #stage{color:#fff!important;background:radial-gradient(70% 90% at 72% 40%,#2c5bea 0%,rgba(44,91,234,0) 60%),linear-gradient(160deg,#16205a 0%,#070a1f 100%)!important}
  #glow{background:radial-gradient(30% 40% at 72% 70%,rgba(83,227,176,.18),transparent 70%)!important}
  #grid{display:none}
  .hd .kicker{color:#9fb3e8!important}
  .hd .sub2{color:#c9d6ff!important}
  .hd .tag{background:rgba(255,255,255,.12)!important;color:#fff;box-shadow:none!important;border:1px solid rgba(255,255,255,.22)}
  .g{background:linear-gradient(90deg,#7fd8ff,#53e3b0)!important;-webkit-background-clip:text!important;background-clip:text!important;color:transparent!important}
  #shadow{background:radial-gradient(closest-side,rgba(0,0,0,.55),rgba(0,0,0,.18) 60%,transparent)!important}

<script>
const Q = new URLSearchParams(location.search);

document.documentElement.classList.add(LAYOUT);
const T = {
  en: { kicker: 'Foldboard for iPhone Duo', a: 'It senses your hand.', b: 'And comes under your thumb.', sub: 'Right hand, it goes right. Switch hands, it follows you. And it learns your habits.', tags: ['Right hand', 'Left hand', 'Learns your habits'] },
  fr: { kicker: 'Foldboard pour iPhone Duo', a: 'Il sent ta main.', b: 'Et vient sous ton pouce.', sub: 'Main droite, il va à droite. Change de main, il te suit. Et il apprend tes habitudes.', tags: ['Main droite', 'Main gauche', 'Il apprend tes habitudes'] },
}[LANG];
const I = n => `fbcap2/${LANG === 'fr' ? 'fr' : 'en'}-${n}.png`;
const R = Math.PI / 2;
const S = LAYOUT === "tall" ? 1.45 : 1.4;

window.FILM = {
  images: [I('right'), I('leftsame'), I('open-land')],
  pose: [
    [0.0, RT],
    [1.30, RT], [1.85, LT],
    [4.30, LT], [4.85, RT],
    [7.30, RT], [7.85, LT],
    [10.30, LT], [10.85, RT],
    [12.0, RT],
  ],
  screens: [{ t: 0, inner: I('open-land'), portrait: false }],
  outers: [{ t: 0, img: I('right') }, { t: 1.50, img: I('leftsame'), prev: I('right'), slide: 0.5, kb: 0.566, dx: -0.223, bg: '#000' }, { t: 4.50, img: I('right'), prev: I('leftsame'), slide: 0.5, kb: 0.566, dx: 0.223, bg: '#000' }, { t: 7.50, img: I('leftsame'), prev: I('right'), slide: 0.5, kb: 0.566, dx: -0.223, bg: '#000' }, { t: 10.50, img: I('right'), prev: I('leftsame'), slide: 0.5, kb: 0.566, dx: 0.223, bg: '#000' }],
  duration: 12,
};
</script>

<div id="stage">
  <div id="glow"></div>
  <div id="grid"></div>
  <div id="shadow"></div>
  <canvas id="gl"></canvas>
  <div class="hd">
    <div class="kicker"><img src="fbicon.png"><span id="k"></span></div>
    <div class="big"><span id="a"></span><br><span class="g" id="b"></span></div>
    <div class="sub2" id="s"></div>
    <div class="tags" id="tg"></div>
  </div>
</div>
<script>
document.getElementById('k').textContent = T.kicker; document.getElementById('a').textContent = T.a;
document.getElementById('b').textContent = T.b; document.getElementById('s').textContent = T.sub;
document.getElementById('tg').innerHTML = T.tags.map(t => '<span class="tag">' + t + '</span>').join('');
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from './lib/loaders/GLTFLoader.js';
import { RoomEnvironment } from './lib/addons/RoomEnvironment.js';
const C = window.FILM;
const cv = document.getElementById('gl'); cv.width = W * DPR; cv.height = H * DPR;
const renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(DPR); renderer.setSize(W, H, false);

const key = new THREE.DirectionalLight(0xffffff, 1.1); key.position.set(0.4, 0.8, 0.6); scene.add(key);
const cam = new THREE.PerspectiveCamera(22, W / H, 0.01, 10);

const vh = 2 * Math.tan(22 / 2 * Math.PI / 180) * cam.position.z, vw = vh * W / H;

// --- screens (canvas textures so two captures can cross-fade)
function screenCanvas(w, h) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const t = new THREE.CanvasTexture(c); t.flipY = false; t.colorSpace = THREE.SRGBColorSpace;

const inner = screenCanvas(2048, 1441), outer = screenCanvas(1024, 1490);
const imgs = {};
function load(name) { return new Promise(r => { const i = new Image(); i.onload = () => { imgs[name] = i; r(); }; i.src = name; }); }

  const { ctx, c } = s; ctx.fillStyle = '#000'; ctx.fillRect(0, 0, c.width, c.height);

  const { ctx, c } = outer; const W2 = c.width, H2 = c.height; ctx.globalAlpha = 1; ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W2, H2);

const easeIO = x => x < 0 ? 0 : x > 1 ? 1 : (x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);

window.ready = (async () => {

  const g = await new Promise(r => new GLTFLoader().load('duo.glb', r));

function fadeWin(t, a, b, d = 0.35) { return Math.min(ease((t - a) / d), ease((b - t) / d)); }

window.frame = (t) => {

  pivot.position.set(0, 0, 0); pivot.updateMatrixWorld(true); root.traverse(o => { if (o.isSkinnedMesh) o.computeBoundingBox(); });

};
</script>
