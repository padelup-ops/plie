# PEEKACLAW : compile le jeu, le lance sur les simulateurs (iPhone Duo, iPhone, iPad) et capture les écrans (branche ci-pince-shots).
name: Peekaclaw - captures

on:
  workflow_dispatch:
    inputs:
      routes:
        description: "Écrans à capturer"
        required: false
        default: "game left right high grab win collection all settings intro"
      wide:
        description: "Écrans à capturer appareil couché"
        required: false
        default: "game left grab"
      devices:
        description: "Simulateurs (duo iphone ipad)"
        required: false
        default: "duo iphone ipad"
      lang:
        description: "Langue (fr ou en)"
        required: false
        default: "fr"

concurrency:
  group: pince-shots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shots:
    runs-on: xcode-27
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      ROUTES: ${{ inputs.routes || 'game left right high grab win collection all settings intro' }}
      LANG_CODE: ${{ inputs.lang || 'fr' }}
      WIDE_ROUTES: ${{ inputs.wide }}
      PREVIEW: "760x535"
      # Chaque simulateur met un bon quart d'heure à démarrer : on ne lance que ceux qu'on veut voir.
      DEVICES: ${{ inputs.devices || 'duo iphone ipad' }}
    steps:
      - uses: actions/checkout@v5
      - name: Choisir Xcode 27.1
        run: |
          XCODE=$(ls -d /Applications/Xcode_27.1*.app 2>/dev/null | grep -v beta | head -1)
          sudo xcode-select -s "${XCODE:-/Applications/Xcode.app}"
          xcodebuild -version
      - name: Générer et compiler pour le simulateur
        run: |
          mkdir -p shots
          command -v xcodegen >/dev/null || brew install xcodegen >/dev/null 2>&1
          cd pince && xcodegen generate && cd ..
          set -o pipefail
          xcodebuild build -project pince/Pince.xcodeproj -scheme Pince -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO 2>&1 | tee shots/build.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -n -B2 -A8 -E "error:" shots/build.log | cut -c1-400 | head -400 > shots/erreurs.txt || true
          grep -n -E "warning:" shots/build.log | grep "pince/Pince" | sort -u | head -80 > shots/avertissements.txt || true
          tail -n 60 shots/build.log > shots/fin-build.txt
          rm -f shots/build.log
          grep -q "BUILD SUCCEEDED" shots/fin-build.txt
      - name: Capturer
        run: |
          BID=com.padelup.pince
          APP=$(find build -name "Pince.app" -path "*iphonesimulator*" | head -1)
          [ "$LANG_CODE" = "en" ] && LANGS="(en)" || LANGS="(fr)"
          # Tous les appareils que les simulateurs installés savent jouer : nom | type | système
          xcrun simctl list runtimes -j | python3 -c "
          import json, sys
          for r in json.load(sys.stdin)['runtimes']:
              if r.get('platform') == 'iOS' and r.get('isAvailable'):
                  for d in r.get('supportedDeviceTypes', []):
                      print(d['name'] + ' | ' + d['identifier'] + ' | ' + r['identifier'])" > shots/appareils.txt
          pick() { grep -E "$1" shots/appareils.txt | grep -v -E "${2:-ZZZ}" | tail -1; }
          capture() {  # nom, ligne de appareils.txt, écrans
            local NAME="$1" LINE="$2" LIST="$3" N=0
            [ -z "$LINE" ] && { echo "pas d'appareil pour $NAME" >> shots/simulateur.txt; return 0; }
            local DT RT UDID
            DT=$(echo "$LINE" | awk -F' [|] ' '{print $2}')
            RT=$(echo "$LINE" | awk -F' [|] ' '{print $3}')
            UDID=$(xcrun simctl create "Pince $NAME" "$DT" "$RT") || return 0
            echo "$NAME : $LINE" >> shots/simulateur.txt
            xcrun simctl boot "$UDID" || return 0
            xcrun simctl bootstatus "$UDID" -b || true
            xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 || true
            xcrun simctl install "$UDID" "$APP" || return 0
            for R in $LIST; do
              N=$((N+1))
              xcrun simctl terminate "$UDID" "$BID" 2>/dev/null || true
              xcrun simctl launch "$UDID" "$BID" -AppleLanguages "$LANGS" -shot "$R" > /dev/null 2>&1 || true
              case "$R" in grab|win) sleep 14 ;; *) sleep 8 ;; esac
              # L'iPhone Duo a deux écrans : on prend les deux.
              for D in primary primary-1; do
                xcrun simctl io "$UDID" screenshot --display=$D --mask=black "shots/$NAME-$(printf %02d $N)-$R-$D.png" > /dev/null 2>>shots/erreurs-captures.txt || true
              done
            done
            # Les mêmes écrans, appareil couché (en dernier : le simulateur reste couché ensuite).
            for R in $WIDE_ROUTES; do
              N=$((N+1))
              xcrun simctl terminate "$UDID" "$BID" 2>/dev/null || true
              # L'iPad du simulateur ne se couche pas : on y dessine le jeu à la taille de l'iPhone Duo ouvert.
              case "$NAME" in ipad) WIDE_ARGS="-previewSize $PREVIEW" ;; *) WIDE_ARGS="-wide YES" ;; esac
              xcrun simctl launch "$UDID" "$BID" -AppleLanguages "$LANGS" -shot "$R" $WIDE_ARGS > /dev/null 2>&1 || true
              case "$R" in grab|win) sleep 15 ;; *) sleep 9 ;; esac
              for D in primary primary-1; do
                xcrun simctl io "$UDID" screenshot --display=$D --mask=black "shots/$NAME-$(printf %02d $N)-$R-large-$D.png" > /dev/null 2>>shots/erreurs-captures.txt || true
              done
            done
            xcrun simctl shutdown "$UDID" || true
          }
          for DEVICE in $DEVICES; do
            case "$DEVICE" in
              duo) capture duo "$(pick '^iPhone Duo')" "$ROUTES" ;;
              iphone) capture iphone "$(pick '^iPhone [0-9]+ Pro [|]')" "$ROUTES" ;;
              ipad) capture ipad "$(pick '^iPad Pro.*11')" "$ROUTES" ;;
            esac
          done
      - name: Publier
        if: always()
        env:
          GH_PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p shots && cd shots
          echo "commit ${{ github.sha }} - $(date -u)" > commit.txt
          git init -q -b ci-pince-shots
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "Captures Peekaclaw"
          git push -q -f "https://x-access-token:${GH_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-pince-shots
