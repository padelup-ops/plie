# UNLOCKED : fabrique les messages vocaux (voix neuronales + son de téléphone) dans la branche ci-unlocked-voices.
name: Unlocked - voix
on:
  workflow_dispatch:
jobs:
  voices:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installer
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg espeak-ng >/dev/null
          pip install --quiet "piper-tts==1.2.0"
          pip install --quiet kokoro soundfile numpy || echo "kokoro non installé"
      - name: Fabriquer les voix
        env:
          OUT: voices-out
        run: python3 unlocked/tools/voices.py
      - name: Publier
        if: always()
        env:
          GH_PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p voices-out && cd voices-out
          rm -f *.wav
          git init -q -b ci-unlocked-voices
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "Voix Unlocked"
          git push -q -f "https://x-access-token:${GH_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-unlocked-voices
