# Envoie Foldly 1.0.24 build 133 à la vérification. Ne change pas le prix ni les autres métadonnées.
name: Clapet - envoyer 1.0.24

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/clapet-submit-1024.yml
      - clapet/tools/asc_submit_1024.py

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
      RELEASE_BUILD: "133"
    steps:
      - uses: actions/checkout@v5
      - name: Envoyer 1.0.24
        run: |
          python3 -m pip install --quiet pyjwt cryptography
          python3 clapet/tools/asc_submit_1024.py 2>&1 | tee submit.txt
