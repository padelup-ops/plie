# FOLDBOARD : récupère un échantillon de vrais swipes en anglais (jeu de données FUTO, licence MIT)
# pour mesurer le glisser du clavier sur de vrais tracés. Résultat publié sur la branche ci-swipedata.
name: Foldboard - Swipes réels (échantillon)
on:
  workflow_dispatch:
    inputs:
      rows:
        description: "Nombre de swipes du jeu de test"
        required: false
        default: "4000"
jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Télécharger
        run: |
          mkdir -p out && cd out
          cat > conv.py <<'EOF'
          import json, sys, collections
          # Convertit des lignes du jeu de données FUTO en lignes compactes : mot, points (x, y entre 0 et 1), taille du canevas.
          mode = sys.argv[1]
          out, stats = {}, collections.Counter()
          for l in sys.stdin:
              try:
                  d = json.loads(l)
              except Exception:
                  continue
              lang, lay = d.get('language', 'en'), d.get('layout', 'qwerty')
              stats[(lang, lay, d.get('dual_finger', 0))] += 1
              if d.get('dual_finger'):
                  continue
              key = f"{lang}-{lay}" if mode == 's5' else 'en-qwerty'
              if mode == 's5' and key not in ('fr-azerty', 'fr-qwerty', 'en-qwerty'):
                  continue
              pts = d['data']
              if not isinstance(pts, list) or len(pts) < 2:
                  continue
              f = out.setdefault(key, open(f"{mode}-{key}.jsonl", 'w'))
              # Les mots d'avant dans la phrase (le contexte, comme dans un vrai message).
              words = (d.get('sentence') or '').split()
              wi = d.get('word_idx') or 0
              before = ' '.join(words[max(0, wi - 3):wi]) + (' ' if wi > 0 else '')
              f.write(json.dumps({'w': d['word'], 'b': before, 'p': [[round(q['x'], 4), round(q['y'], 4)] for q in pts],
                                  'cw': d.get('canvas_width'), 'ch': d.get('canvas_height'), 'd': round(d.get('distance') or 0, 1)}) + '\n')
          print(mode, stats.most_common(30))
          EOF
          B=https://huggingface.co/datasets/futo-org/swipe.futo.org
          curl -sL "$B/resolve/main/swipe-5/layouts/qwerty.json" > qwerty.json
          curl -sL "$B/resolve/main/swipe-5/layouts/azerty.json" > azerty.json
          # Anglais : le début du jeu de test principal. Français : les swipes AZERTY à un doigt de la 5e collecte.
          curl -sL "$B/resolve/main/test.jsonl" | head -n ${{ inputs.rows }} | python3 conv.py test || true
          curl -sL "$B/resolve/main/swipe-5/swipe5.jsonl" | python3 conv.py s5 || true
          rm -f conv.py
          ls -la; wc -l *.jsonl
          head -c 700 azerty.json; echo
      - name: Publier
        run: |
          cd out
          printf 'Swipes: FUTO swipe.futo.org dataset (https://huggingface.co/datasets/futo-org/swipe.futo.org), MIT License.\n' > SOURCE.txt
          git init -q -b ci-swipedata
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "Échantillon de swipes réels (FUTO, MIT)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" ci-swipedata
