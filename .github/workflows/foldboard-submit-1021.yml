# Envoie Foldboard 1.0.21 build 149 à la vérification. Ne change pas le prix ni les autres métadonnées.
name: Foldboard - envoyer 1.0.21

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/foldboard-submit-1021.yml
      - foldboard/tools/asc_submit_1021.py

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
      RELEASE_BUILD: "149"
    steps:
      - uses: actions/checkout@v5
      - name: Envoyer 1.0.21
        run: |
          python3 -m pip install --quiet pyjwt cryptography
          python3 foldboard/tools/asc_submit_1021.py 2>&1 | tee submit.txt
