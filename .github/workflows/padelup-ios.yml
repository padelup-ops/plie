# PADELUP NEO : compile l'app sur un Mac de GitHub, l'envoie sur TestFlight (fiche « PADELUP Neo », com.padelup.neo),
# puis prend des captures sur le simulateur. Journaux et captures : branche ci-padelup-ios.
# Les clubs du monde (OpenStreetMap) viennent de la branche ci-padelup-clubs (workflow « PadelUp - clubs du monde »).
name: PadelUp Neo - TestFlight
on:
  push:
    branches: [main, "claude/**"]
    paths:
      - "padelup/ios/**"
      - ".github/workflows/padelup-ios.yml"
  workflow_dispatch:
concurrency:
  group: padelup-ios
  cancel-in-progress: true
jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 75
    permissions:
      contents: write
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      BUILD_NUMBER: ${{ github.run_number }}
      PADELUP_BUNDLE: com.padelup.neo
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Choisir Xcode 27.1
        run: |
          XCODE=$(ls -d /Applications/Xcode_27.1*.app 2>/dev/null | grep -v beta | head -1)
          if [ -z "$XCODE" ]; then XCODE=$(ls -d /Applications/Xcode_27.1*.app 2>/dev/null | head -1); fi
          sudo xcode-select -s "${XCODE:-/Applications/Xcode.app}"
          xcodebuild -version
          mkdir -p ci
      - name: Embarquer les clubs du monde (OpenStreetMap)
        run: |
          if git fetch -q --depth 1 origin ci-padelup-clubs 2>/dev/null && git show FETCH_HEAD:clubs-world.json > /tmp/clubs.json 2>/dev/null && [ -s /tmp/clubs.json ]; then
            cp /tmp/clubs.json padelup/ios/App/Resources/clubs-world.json
            echo "clubs embarqués : $(du -h padelup/ios/App/Resources/clubs-world.json | cut -f1)" | tee ci/clubs.txt
          else
            echo "pas encore de fichier mondial : l'app actualisera en direct" | tee ci/clubs.txt
          fi
      - name: Installer XcodeGen et générer le projet
        run: |
          if ! command -v xcodegen >/dev/null; then brew install xcodegen >/dev/null 2>&1 || true; fi
          if ! command -v xcodegen >/dev/null; then
            curl -sSL -o "$RUNNER_TEMP/xcodegen.zip" https://github.com/yonaskolb/XcodeGen/releases/latest/download/xcodegen.zip
            unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xg"
            echo "$RUNNER_TEMP/xg/xcodegen/bin" >> "$GITHUB_PATH"
            export PATH="$RUNNER_TEMP/xg/xcodegen/bin:$PATH"
          fi
          cd padelup/ios && xcodegen generate
      - name: Vérifier que l'app compile
        run: |
          set -o pipefail
          cd padelup/ios
          xcodebuild build -project PadelUpNeo.xcodeproj -scheme PadelUpNeo -configuration Release \
            -destination 'generic/platform=iOS' DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee ../../ci/build.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -n -E "error:" ../../ci/build.log | head -150 > ../../ci/erreurs.txt || true
          grep -q "BUILD SUCCEEDED" ../../ci/build.log
      - name: Fiche App Store Connect
        id: asc
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$ASC_PRIVATE_KEY" > "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"
          python3 -m pip install --quiet --user pyjwt cryptography >/dev/null 2>&1 || python3 -m pip install --quiet --break-system-packages pyjwt cryptography >/dev/null 2>&1 || true
          python3 padelup/ios/tools/setup.py 2>&1 | grep -v "^APP \|^IDENT" | tee ci/fiche.txt || true
          if grep -q "^FICHE  ok" ci/fiche.txt; then echo "record=true" >> "$GITHUB_OUTPUT"; else echo "record=false" >> "$GITHUB_OUTPUT"; fi
      - name: Archiver
        run: |
          set -o pipefail
          cd padelup/ios
          xcodebuild archive -project PadelUpNeo.xcodeproj -scheme PadelUpNeo -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/PadelUpNeo.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" 2>&1 | tee ../../ci/archive.log | grep -E "error:|ARCHIVE (SUCCEEDED|FAILED)" || true
          grep -q "ARCHIVE SUCCEEDED" ../../ci/archive.log
      - name: Droits de l'app (Se connecter avec Apple)
        run: |
          APP="$RUNNER_TEMP/PadelUpNeo.xcarchive/Products/Applications/PadelUpNeo.app"
          cat > "$RUNNER_TEMP/app.entitlements" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>com.apple.developer.applesignin</key>
            <array><string>Default</string></array>
          </dict>
          </plist>
          EOF
          codesign -f -s - --entitlements "$RUNNER_TEMP/app.entitlements" "$APP"
          du -sh "$APP"
      - name: Signer et envoyer sur TestFlight
        run: |
          set -o pipefail
          DEST=export
          if [ "${{ steps.asc.outputs.record }}" = "true" ]; then DEST=upload; fi
          cat > "$RUNNER_TEMP/Export.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>${DEST}</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/PadelUpNeo.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/Export.plist" \
            -exportPath "$RUNNER_TEMP/out" -allowProvisioningUpdates -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" 2>&1 | tee ci/export.log
          grep -q -E "EXPORT SUCCEEDED|Upload succeeded|Uploaded" ci/export.log
          if [ "$DEST" = "upload" ]; then echo "envoyé : build $BUILD_NUMBER" | tee ci/testflight.txt; else echo "fiche absente : build signé, non envoyé" | tee ci/testflight.txt; fi
      - name: Captures sur le simulateur
        if: always()
        continue-on-error: true
        timeout-minutes: 30
        env:
          DEVICE: iPhone 17 Pro
        run: |
          mkdir -p ci/shots
          find_runtime() {
            xcrun simctl list runtimes -j | python3 -c "
          import json, os, sys
          rs = [r for r in json.load(sys.stdin)['runtimes']
                if r.get('platform') == 'iOS' and r.get('isAvailable')
                and any(os.environ['DEVICE'] in d.get('name', '') for d in r.get('supportedDeviceTypes', []))]
          print(rs[-1]['identifier'] if rs else '')"
          }
          RUNTIME=$(find_runtime)
          DT=$(xcrun simctl list devicetypes -j | python3 -c "
          import json, os, sys
          d = [x for x in json.load(sys.stdin)['devicetypes'] if os.environ['DEVICE'] in x['name']]
          print(d[0]['identifier'] if d else '')")
          echo "runtime=$RUNTIME device=$DT" > ci/shots/simulateur.txt
          UDID=$(xcrun simctl create "PadelUpNeo" "$DT" "$RUNTIME")
          xcrun simctl boot "$UDID"; xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 || true
          set -o pipefail
          xcodebuild build -project padelup/ios/PadelUpNeo.xcodeproj -scheme PadelUpNeo -configuration Debug -sdk iphonesimulator \
            -destination "id=$UDID" -derivedDataPath "$RUNNER_TEMP/sim" CODE_SIGNING_ALLOWED=NO 2>&1 | tail -3
          APP=$(find "$RUNNER_TEMP/sim" -name "PadelUpNeo.app" -path "*iphonesimulator*" | head -1)
          xcrun simctl install "$UDID" "$APP"
          BID=com.padelup.neo
          xcrun simctl privacy "$UDID" grant location "$BID" || true
          lim() { if command -v timeout >/dev/null; then timeout "$@"; elif command -v gtimeout >/dev/null; then gtimeout "$@"; else shift; "$@"; fi; }
          shot() {
            xcrun simctl terminate "$UDID" "$BID" 2>/dev/null || true
            lim 60 xcrun simctl launch "$UDID" "$BID" -AppleLanguages "(fr)" -AppleLocale fr_FR -shot "$1" -seasonMode "$2" > /dev/null 2>&1 || true
            sleep "$3"
            lim 60 xcrun simctl io "$UDID" screenshot "ci/shots/$4.png" > /dev/null 2>&1 || true
          }
          shot home auto 12 warmup
          shot home auto 8 01-accueil-automne
          shot clubs auto 14 02-carte
          shot club auto 10 03-club-dispos
          shot bot auto 8 04-bot
          shot matches auto 8 05-matchs
          shot profile auto 6 06-profil
          shot home christmas 8 07-accueil-noel
          shot home newYear 8 08-accueil-nouvel-an
          rm -f ci/shots/warmup.png
          xcrun simctl shutdown all || true
          ls -la ci/shots
      - name: Publier journaux et captures (branche ci-padelup-ios)
        if: always()
        env:
          GH_PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/pub" && cp -R ci/. "$RUNNER_TEMP/pub/" 2>/dev/null || true
          cd "$RUNNER_TEMP/pub"
          for f in build.log archive.log export.log; do
            if [ -f "$f" ]; then grep -n -B2 -A4 -E "error:" "$f" | head -800 > "erreurs-${f%.log}.txt" || true; tail -n 120 "$f" > "fin-${f%.log}.txt"; rm -f "$f"; fi
          done
          echo "build $BUILD_NUMBER - commit ${{ github.sha }} - $(date -u)" > build.txt
          git init -q -b ci-padelup-ios
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "PadelUp Neo build $BUILD_NUMBER"
          git push -q -f "https://x-access-token:${GH_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-padelup-ios
      - name: Effacer la clé
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
