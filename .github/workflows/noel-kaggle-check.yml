# ALLÔ PÈRE NOËL : pourquoi le calcul Kaggle reste « en file d'attente ».
# mode=etat : quota de carte graphique de la semaine, état et journal des calculs déjà envoyés. Ne lance rien.
# mode=test : lance aussi trois petits calculs (sans carte graphique, carte T4, carte T4 et internet) pour voir lequel démarre.
# Ne publie rien.
name: Noël - diagnostic Kaggle

on:
  workflow_dispatch:
    inputs:
      user:
        description: "Nom d'utilisateur Kaggle"
        required: false
        default: "hfreecs"
      mode:
        description: "etat ou test"
        required: false
        default: "etat"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KUSER: ${{ inputs.user }}
      MODE: ${{ inputs.mode }}
    steps:
      - name: Diagnostic
        run: |
          pip install -q -U kaggle 2>&1 | tail -1
          kaggle --version
          echo "== quota de la semaine"
          kaggle quota 2>&1 | tail -5
          echo "== calculs du compte"
          kaggle kernels list --mine --page-size 20 2>&1 | head -25
          for k in allo-pere-noel-essai allo-pere-noel-test-gpu allo-pere-noel-test-cpu; do
            echo "== $k"
            kaggle kernels status "$KUSER/$k" 2>&1 | tail -1
            timeout 60 kaggle kernels logs "$KUSER/$k" 2>&1 | tail -8 | cut -c1-300 || true
          done
          [ "$MODE" = test ] || exit 0
          # Un carnet (notebook) au lieu d'un script, avec la carte T4 : est-ce que celui-là démarre ?
          mkdir -p k-nb
          printf '{"id":"%s/allo-pere-noel-nb","title":"allo-pere-noel-nb","code_file":"run.ipynb","language":"python","kernel_type":"notebook","is_private":true,"enable_gpu":true,"enable_internet":false,"machine_shape":"NvidiaTeslaT4","dataset_sources":[],"competition_sources":[],"kernel_sources":[]}' "$KUSER" > k-nb/kernel-metadata.json
          python3 - <<'PY'
          import json
          nb = {"cells": [{"cell_type": "code", "execution_count": None, "metadata": {}, "outputs": [],
                           "source": ["import subprocess\n", "print(subprocess.run('nvidia-smi -L || echo sans GPU', shell=True, capture_output=True, text=True).stdout)"]}],
                "metadata": {"kernelspec": {"display_name": "Python 3", "language": "python", "name": "python3"}}, "nbformat": 4, "nbformat_minor": 4}
          json.dump(nb, open("k-nb/run.ipynb", "w"))
          PY
          kaggle kernels push -p k-nb 2>&1 | tail -3
          for i in $(seq 1 15); do
            S=$(kaggle kernels status "$KUSER/allo-pere-noel-nb" 2>&1 | tail -1 | sed 's/.*KernelWorkerStatus\.//; s/"//g')
            echo "$(date -u +%H:%M) carnet=$S"
            echo "$S" | grep -qiE "complete|error|cancel" && break
            sleep 60
          done
          timeout 60 kaggle kernels logs "$KUSER/allo-pere-noel-nb" 2>&1 | grep -i "tesla\|gpu\|sans" | head -3 || true
