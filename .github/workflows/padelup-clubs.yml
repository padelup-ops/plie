# PADELUP NEO : récupère les clubs de padel de la zone PadelUp (France, Belgique, Suisse, pays frontaliers de la France,
# Maroc, Algérie, Tunisie) sur OpenStreetMap (Overpass) et publie clubs-zone.json dans la branche ci-padelup-clubs.
# Le workflow TestFlight l'embarque dans l'app.
name: PadelUp - clubs de la zone
on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"   # chaque lundi
  push:
    branches: ["claude/**"]
    paths:
      - "padelup/tools/zone_clubs.py"
      - "padelup/backend/app/opendata.py"
      - ".github/workflows/padelup-clubs.yml"
concurrency:
  group: padelup-clubs
  cancel-in-progress: true
jobs:
  clubs:
    runs-on: ubuntu-latest
    timeout-minutes: 115
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Interroger OpenStreetMap
        timeout-minutes: 100
        run: |
          set -o pipefail
          python3 -u padelup/tools/zone_clubs.py "$RUNNER_TEMP/clubs-zone.json" 2>&1 | tee "$RUNNER_TEMP/journal.txt"
      - name: Publier (fichier complet ou partiel, et journal)
        if: always()
        env:
          GH_PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/ci" && cd "$RUNNER_TEMP/ci"
          git init -q
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          cp "$RUNNER_TEMP/journal.txt" . 2>/dev/null || echo "pas de journal" > journal.txt
          echo "commit ${{ github.sha }} - $(date -u)" > run.txt
          BRANCH=ci-padelup-clubs-log
          if [ -s "$RUNNER_TEMP/clubs-zone.json" ] && [ "$(stat -c %s "$RUNNER_TEMP/clubs-zone.json")" -gt 20000 ]; then
            OLD=$(cd "$GITHUB_WORKSPACE" && git fetch -q --depth 1 origin ci-padelup-clubs 2>/dev/null && git show FETCH_HEAD:clubs-zone.json 2>/dev/null | python3 -c "import json,sys; print(len(json.load(sys.stdin)['clubs']))" 2>/dev/null || echo 0)
            NEW=$(python3 -c "import json; print(len(json.load(open('$RUNNER_TEMP/clubs-zone.json'))['clubs']))")
            echo "clubs : avant $OLD, maintenant $NEW" | tee -a journal.txt
            if [ "$NEW" -ge $(( OLD * 9 / 10 )) ]; then
              cp "$RUNNER_TEMP/clubs-zone.json" .
              BRANCH=ci-padelup-clubs
            fi
          fi
          git checkout -q -b "$BRANCH"
          git add -A && git commit -qm "Clubs de padel de la zone PadelUp (OpenStreetMap)"
          git push -q -f "https://x-access-token:${GH_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$BRANCH"
