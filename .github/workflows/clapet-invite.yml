# Testeur interne TestFlight : invitation App Store Connect (rôle restreint, une app) puis groupe interne.
# Le dépôt est public : on ne donne que l'empreinte SHA-256 de l'e-mail, jamais l'adresse.
name: Clapet - testeur interne
on:
  workflow_dispatch:
    inputs:
      email_sha256:
        description: "SHA-256 de l'e-mail en minuscules (jamais l'adresse)"
        required: true
      app_id:
        description: "Identifiant Apple de l'app"
        required: true
        default: "6832556606"
      role:
        description: "Rôle App Store Connect"
        required: false
        default: "MARKETING"
jobs:
  invite:
    runs-on: ubuntu-latest
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
      EMAIL_SHA256: ${{ inputs.email_sha256 }}
      APP_ID: ${{ inputs.app_id }}
      ROLE: ${{ inputs.role }}
    steps:
      - uses: actions/checkout@v5
      - run: python3 -m pip install --quiet pyjwt cryptography
      - run: python3 clapet/tools/asc_invite.py
