# FOLDBOARD : banc d'essai de la saisie (correction, glisser, prédiction) dans le simulateur iOS.
# À lancer avant et après un changement du moteur (Shared/Suggest.swift, LanguageModel.swift) : aucune régression.
name: Foldboard - Bench
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branche, tag ou commit à mesurer"
        required: false
        default: "main"
jobs:
  bench:
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - name: Choisir Xcode 27.1
        run: |
          XCODE=$(ls -d /Applications/Xcode_27.1*.app 2>/dev/null | grep -v beta | head -1)
          if [ -z "$XCODE" ]; then XCODE=$(ls -d /Applications/Xcode_27.1*.app 2>/dev/null | head -1); fi
          if [ -z "$XCODE" ]; then XCODE=/Applications/Xcode.app; fi
          sudo xcode-select -s "$XCODE"
      - name: Compile
        run: |
          mkdir -p out
          # Le banc est toujours celui de main (mêmes essais pour comparer deux versions du moteur).
          git fetch -q origin main && git show origin/main:foldboard/tools/bench/main.swift > out/main.swift
          cd foldboard/Shared
          xcrun --sdk iphonesimulator swiftc -O -target arm64-apple-ios27.0-simulator \
            *.swift ../../out/main.swift -o ../../out/bench
          cp words-*.txt lm-*.bin ../../out/
      - name: Run
        run: |
          DEV=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if 'iPhone' in x['name']))")
          xcrun simctl boot "$DEV" || true
          xcrun simctl bootstatus "$DEV" -b
          xcrun simctl spawn "$DEV" "$PWD/out/bench" | tee out/result.txt
      - uses: actions/upload-artifact@v4
        with:
          name: bench
          path: out/result.txt
