# FOLDBOARD : banc d'essai de la saisie (correction, glisser, prédiction) dans le simulateur iOS.
# À lancer avant et après un changement du moteur (Shared/Suggest.swift, LanguageModel.swift) : aucune régression.
name: Foldboard - Bench
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branche, tag ou commit à mesurer"
        required: false
        default: "main"
jobs:
  bench:
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}
      - name: Choisir Xcode 27.1
        run: |
          XCODE=$(ls -d /Applications/Xcode_27.1*.app 2>/dev/null | grep -v beta | head -1)
          if [ -z "$XCODE" ]; then XCODE=$(ls -d /Applications/Xcode_27.1*.app 2>/dev/null | head -1); fi
          if [ -z "$XCODE" ]; then XCODE=/Applications/Xcode.app; fi
          sudo xcode-select -s "$XCODE"
      - name: Compile
        run: |
          mkdir -p out
          bash foldboard/tools/fetch_executorch.sh
          ET=foldboard/Vendor
          S=ios-arm64-simulator
          LIBS=""
          for pair in \
            "executorch/libexecutorch_simulator.a" \
            "backend_xnnpack/libbackend_xnnpack_simulator.a" \
            "kernels_optimized/libkernels_optimized_simulator.a" \
            "kleidiai/libkleidiai_simulator.a" \
            "threadpool/libthreadpool_simulator.a"
          do
            lib="$ET/${pair%%/*}.xcframework/$S/${pair#*/}"
            LIBS="$LIBS -Xlinker -force_load -Xlinker $lib"
          done
          # Le banc de cette branche : géométrie seule (gNeural=0) puis reclassement FUTO Swipe.
          xcrun --sdk iphonesimulator swiftc -O -target arm64-apple-ios27.0-simulator \
            -D FOLDBOARD_NEURAL \
            -I "$ET/executorch.xcframework/$S/Headers" \
            foldboard/Shared/*.swift foldboard/tools/bench/main.swift \
            $LIBS -lc++ -lsqlite3 -framework Accelerate -framework CoreML -framework CoreGraphics -framework CoreImage -framework CoreVideo \
            -o out/bench
          cp foldboard/Shared/words-*.txt foldboard/Shared/lm-*.bin foldboard/Shared/FUTO/futo-swipe-encoder-int8.pte out/
          ls -lh out/bench out/*.pte
          # Vrais swipes (FUTO swipe.futo.org, MIT), préparés par foldboard-swipedata.yml.
          # Vraies fautes (foldboard-words.yml) : banc seulement.
          git fetch -q origin ci-foldboard-words && for f in typos-fr.txt typos-en.txt; do git show origin/ci-foldboard-words:$f > out/$f 2>/dev/null || echo "absent $f"; done
          git fetch -q origin ci-swipedata && for f in test-en-qwerty.jsonl s5-fr-azerty.jsonl qwerty.json azerty.json; do git show origin/ci-swipedata:$f > out/$f 2>/dev/null || echo "absent $f"; done
      - name: Run
        run: |
          set -o pipefail
          DEV=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if 'iPhone' in x['name']))")
          xcrun simctl boot "$DEV" || true
          xcrun simctl bootstatus "$DEV" -b
          xcrun simctl spawn "$DEV" "$PWD/out/bench" | tee out/result.txt
      - uses: actions/upload-artifact@v4
        with:
          name: bench
          path: out/result.txt
