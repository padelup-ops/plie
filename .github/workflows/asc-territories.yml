name: App Store - pays
on:
  workflow_dispatch:
    inputs:
      bundle: { description: "Identifiant de l'app", required: true, default: "com.padelup.foldboard" }
      mode: { description: "probe ou open", required: false, default: "probe" }
jobs:
  t:
    runs-on: ubuntu-latest
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
      BUNDLE: ${{ inputs.bundle }}
      MODE: ${{ inputs.mode }}
    steps:
      - uses: actions/checkout@v5
      - run: python3 -m pip install --quiet pyjwt cryptography && python3 tools/asc_territories.py
