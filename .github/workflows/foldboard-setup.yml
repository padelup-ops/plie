# FOLDBOARD : identifiants, groupe interne et testeurs internes (sans compiler).
name: Foldboard - préparation
on:
  workflow_dispatch:
jobs:
  setup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v5
      - run: |
          python3 -m pip install --quiet pyjwt cryptography
          python3 foldboard/tools/setup.py 2>&1 | tee setup.txt
