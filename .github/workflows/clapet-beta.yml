# DUO FOLDS (projet Clapet) : achat Duo Folds+, fiche App Store Connect (en/fr) et distribution d'un build aux testeurs TestFlight.
name: Clapet - testeurs

on:
  workflow_dispatch:
    inputs:
      build:
        description: "Numéro du build (vide = le dernier)"
        required: false

jobs:
  beta:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: write
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
      ORIGAMO_BUNDLE_ID: ${{ secrets.BUNDLE_ID }}
      BUILD_NUMBER: ${{ inputs.build }}
    steps:
      - uses: actions/checkout@v5
      - name: Achat Duo Folds+
        run: |
          python3 -m pip install --quiet pyjwt cryptography
          python3 clapet/tools/asc_plus.py 2>&1 | tee plus.txt || true
      - name: Fiche et testeurs
        run: |
          python3 clapet/tools/asc.py 2>&1 | tee beta.txt
      - name: Publier le rapport
        if: always()
        env:
          GH_PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/r" && cp beta.txt "$RUNNER_TEMP/r/" 2>/dev/null || echo "pas de rapport" > "$RUNNER_TEMP/r/beta.txt"
          cp plus.txt "$RUNNER_TEMP/r/" 2>/dev/null || true
          cd "$RUNNER_TEMP/r"
          git init -q -b ci-clapet-beta
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "Rapport testeurs Clapet"
          git push -q -f "https://x-access-token:${GH_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-clapet-beta
