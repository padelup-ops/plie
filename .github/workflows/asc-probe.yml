name: App Store Connect - sonde
on:
  workflow_dispatch:
    inputs:
      tool:
        description: "Outil à lancer (asc_probe.py, asc_crashes.py)"
        required: false
        default: "asc_probe.py"
      bundle:
        description: "Bundle de l'app (asc_crashes.py)"
        required: false
        default: ""
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
      ORIGAMO: ${{ secrets.BUNDLE_ID }}
      TOOL: ${{ inputs.tool || 'asc_probe.py' }}
      BUNDLE: ${{ inputs.bundle }}
    steps:
      - uses: actions/checkout@v5
      - run: python3 -m pip install --quiet pyjwt cryptography
      - run: |
          case "$TOOL" in asc_probe.py|asc_crashes.py) python3 "tools/$TOOL" ;; *) echo "outil inconnu"; exit 1 ;; esac
