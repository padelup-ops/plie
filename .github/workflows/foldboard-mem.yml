# FOLDBOARD : banc d'essai de la mémoire sur le simulateur iPhone Duo (le vrai clavier, Duo ouvert, toute la largeur).
name: Foldboard - memoire

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: "Debug ou Release"
        required: false
        default: "Release"

jobs:
  mem:
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Choisir Xcode 27.1
        run: |
          XCODE=$(ls -d /Applications/Xcode_27.1*.app 2>/dev/null | grep -v beta | head -1)
          sudo xcode-select -s "${XCODE:-/Applications/Xcode.app}"
      - name: Compiler pour le simulateur
        run: |
          mkdir -p out
          command -v xcodegen >/dev/null || brew install xcodegen >/dev/null 2>&1
          cd foldboard && xcodegen generate && cd ..
          set -o pipefail
          xcodebuild build -project foldboard/Foldboard.xcodeproj -scheme Foldboard -configuration ${{ inputs.configuration || 'Release' }} -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO 2>&1 | tee out/build.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -n -E "error:" out/build.log | head -60 || true
          grep -q "BUILD SUCCEEDED" out/build.log
      - name: Mesurer
        run: |
          APP=$(find build -name "Foldboard.app" -path "*iphonesimulator*" | head -1)
          BID=com.padelup.foldboard
          RUNTIME=$(xcrun simctl list runtimes -j | python3 -c "
          import json, sys
          rs = [r for r in json.load(sys.stdin)['runtimes'] if r.get('platform') == 'iOS' and r.get('isAvailable')
                and any('Duo' in d.get('name', '') for d in r.get('supportedDeviceTypes', []))]
          print(rs[-1]['identifier'] if rs else '')")
          DT=$(xcrun simctl list devicetypes -j | python3 -c "
          import json, sys
          d = [x for x in json.load(sys.stdin)['devicetypes'] if 'Duo' in x['name']]
          print(d[-1]['identifier'] if d else '')")
          echo "runtime=$RUNTIME device=$DT"
          UDID=$(xcrun simctl create "Foldboard mem" "$DT" "$RUNTIME")
          xcrun simctl boot "$UDID"; xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" "$BID" -AppleLanguages "(fr)" -AppleLocale fr_FR -shot memprobe > /dev/null 2>&1 || true
          DATA=$(xcrun simctl get_app_container "$UDID" "$BID" data)
          F="$DATA/Documents/memprobe.txt"
          PID=$(pgrep -f "Foldboard.app/Foldboard" | head -1)
          echo "pid=$PID"
          snap() {
            echo "=== footprint $1 ==="; footprint "$PID" 2>&1 | head -60 || true
            echo "=== vmmap $1 ==="; vmmap --summary "$PID" 2>&1 | sed -n '/REGION TYPE/,/TOTAL/p' | head -70 || true
            echo "=== heap $1 ==="; heap -s "$PID" 2>&1 | sed -n '1,90p' || true
          }
          for i in $(seq 1 120); do grep -q "^SNAP$" "$F" 2>/dev/null && break; sleep 2; done
          cat "$F" || true
          snap 1 > out/snap1.txt 2>&1
          for i in $(seq 1 120); do grep -q "^SNAP2$" "$F" 2>/dev/null && break; sleep 2; done
          snap 2 > out/snap2.txt 2>&1
          echo "=== leaks ===" > out/leaks.txt; leaks "$PID" 2>&1 | head -150 >> out/leaks.txt || true
          for i in $(seq 1 60); do grep -q "^DONE$" "$F" 2>/dev/null && break; sleep 2; done
          echo "################ MEMPROBE"; cat "$F" || true
          echo "################ SNAP1"; cat out/snap1.txt
          echo "################ SNAP2"; cat out/snap2.txt
          echo "################ LEAKS"; cat out/leaks.txt
