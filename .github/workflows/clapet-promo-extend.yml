# Lit la promo Foldly+ et repousse seulement sa date de fin. Ne soumet rien, ne touche pas aux autres apps.
name: Clapet - prolonger la promo

on:
  push:
    branches: [cursor/lifetime-hours-chart-values-e8a9]
    paths:
      - clapet/tools/asc_promo_extend.py
      - .github/workflows/clapet-promo-extend.yml

jobs:
  extend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
      EXTEND: "0"
    steps:
      - uses: actions/checkout@v5
      - name: Lire et prolonger
        run: |
          python3 -m pip install --quiet pyjwt cryptography
          python3 clapet/tools/asc_promo_extend.py 2>&1 | tee promo.txt
