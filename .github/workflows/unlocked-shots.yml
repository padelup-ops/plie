# UNLOCKED : lance le jeu sur un simulateur iPhone et capture les écrans (branche ci-unlocked-shots).
name: Unlocked - captures

on:
  workflow_dispatch:
    inputs:
      routes:
        description: "Écrans à capturer"
        required: false
        default: "lock pad home messages thread threadh photos photo album notes note phone calendar maps trip weather settings spy"
      lang:
        description: "Langue (fr ou en)"
        required: false
        default: "fr"

jobs:
  shots:
    runs-on: xcode-27
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Choisir Xcode 27.1
        run: |
          XCODE=$(ls -d /Applications/Xcode_27.1*.app 2>/dev/null | grep -v beta | head -1)
          sudo xcode-select -s "${XCODE:-/Applications/Xcode.app}"
      - name: Générer et compiler pour le simulateur
        run: |
          mkdir -p shots
          command -v xcodegen >/dev/null || brew install xcodegen >/dev/null 2>&1
          cd unlocked && xcodegen generate
          RUNTIME=$(xcrun simctl list runtimes -j | python3 -c "
          import json,sys
          rs=[r for r in json.load(sys.stdin)['runtimes'] if r.get('platform')=='iOS' and r.get('isAvailable')]
          print(rs[-1]['identifier'] if rs else '')")
          if [ -z "$RUNTIME" ]; then xcodebuild -downloadPlatform iOS 2>&1 | tail -3; RUNTIME=$(xcrun simctl list runtimes -j | python3 -c "
          import json,sys
          rs=[r for r in json.load(sys.stdin)['runtimes'] if r.get('platform')=='iOS' and r.get('isAvailable')]
          print(rs[-1]['identifier'] if rs else '')"); fi
          DT=$(xcrun simctl list runtimes -j | RT="$RUNTIME" python3 -c "
          import json,sys,os
          r=[x for x in json.load(sys.stdin)['runtimes'] if x['identifier']==os.environ['RT']][0]
          d=[x for x in r.get('supportedDeviceTypes',[]) if x['name'].startswith('iPhone') and 'Pro' in x['name'] and 'Max' not in x['name']]
          print(d[-1]['identifier'] if d else r['supportedDeviceTypes'][0]['identifier'])")
          echo "runtime=$RUNTIME device=$DT" | tee ../shots/simulateur.txt
          UDID=$(xcrun simctl create "Unlocked" "$DT" "$RUNTIME")
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"; xcrun simctl bootstatus "$UDID" -b
          xcodebuild build -project Unlocked.xcodeproj -scheme Unlocked -configuration Debug -sdk iphonesimulator \
            -destination "id=$UDID" -derivedDataPath build CODE_SIGNING_ALLOWED=NO 2>&1 | grep -E "error:|BUILD (SUCCEEDED|FAILED)" | tee ../shots/build.txt
          APP=$(find build -name "Unlocked.app" -path "*iphonesimulator*" | head -1)
          xcrun simctl install "$UDID" "$APP"
      - name: Capturer
        run: |
          BID=com.padelup.unlocked
          L="${{ inputs.lang }}"
          [ "$L" = "en" ] && LANGS="(en)" || LANGS="(fr)"
          N=0
          for R in ${{ inputs.routes }}; do
            N=$((N+1))
            xcrun simctl terminate "$UDID" "$BID" 2>/dev/null || true
            if [ "$R" = "home" ]; then ARGS="-shot home"; else ARGS="-shot $R"; fi
            xcrun simctl launch "$UDID" "$BID" -AppleLanguages "$LANGS" $ARGS > /dev/null 2>&1 || true
            sleep 6
            xcrun simctl io "$UDID" screenshot --mask=black "shots/$(printf %02d $N)-$R.png" 2>>shots/erreurs.txt || true
          done
      - name: Publier
        if: always()
        env:
          GH_PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p shots && cd shots
          git init -q -b ci-unlocked-shots
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "Captures Unlocked"
          git push -q -f "https://x-access-token:${GH_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-unlocked-shots
