# ALLÔ PÈRE NOËL : captures sur le simulateur iPhone, dans chaque langue, pour la fiche App Store.
# L'app est lancée avec « -shot nom » (voir ShotMode dans Models.swift) et ouvre l'écran voulu avec un exemple.
name: Noël - captures

on:
  workflow_dispatch:
    inputs:
      routes:
        description: "Captures (séparées par des espaces)"
        required: false
        default: "home setup scenario incoming call surprise end card paywall discover"
      langs:
        description: "Langues (en fr es de it pt-BR)"
        required: false
        default: "fr en"
      wait:
        description: "Secondes avant chaque capture"
        required: false
        default: "4"
      device:
        description: "Simulateur (partie du nom)"
        required: false
        default: "iPhone 17 Pro Max"

jobs:
  shots:
    runs-on: xcode-27
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Choisir Xcode 27.1
        run: |
          XCODE=$(ls -d /Applications/Xcode_27.1*.app 2>/dev/null | grep -v beta | head -1)
          sudo xcode-select -s "${XCODE:-/Applications/Xcode.app}"
      - name: Compiler et installer sur le simulateur
        env:
          DEVICE: ${{ inputs.device }}
        run: |
          mkdir -p shots
          find_runtime() {
            xcrun simctl list runtimes -j | python3 -c "
          import json, os, sys
          rs = [r for r in json.load(sys.stdin)['runtimes']
                if r.get('platform') == 'iOS' and r.get('isAvailable')
                and any(os.environ['DEVICE'] in d.get('name', '') for d in r.get('supportedDeviceTypes', []))]
          print(rs[-1]['identifier'] if rs else '')"
          }
          RUNTIME=$(find_runtime)
          if [ -z "$RUNTIME" ]; then xcodebuild -downloadPlatform iOS 2>&1 | tail -3; RUNTIME=$(find_runtime); fi
          DT=$(xcrun simctl list devicetypes -j | python3 -c "
          import json, os, sys
          d = [x for x in json.load(sys.stdin)['devicetypes'] if os.environ['DEVICE'] in x['name']]
          print(d[0]['identifier'] if d else '')")
          echo "runtime=$RUNTIME device=$DT" | tee shots/simulateur.txt
          UDID=$(xcrun simctl create "Noel" "$DT" "$RUNTIME")
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"; xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 || true
          set -o pipefail
          if ! command -v xcodegen >/dev/null; then brew install xcodegen >/dev/null 2>&1 || true; fi
          (cd noel && xcodegen generate)
          xcodebuild build -project noel/AlloPereNoel.xcodeproj -scheme AlloPereNoel -configuration Debug -sdk iphonesimulator \
            -destination "id=$UDID" -derivedDataPath build CODE_SIGNING_ALLOWED=NO 2>&1 | tee shots/build.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -n -E "error:|warning:" shots/build.log | grep -v "/build/" | head -120 > shots/erreurs.txt || true
          grep -q "BUILD SUCCEEDED" shots/build.log
          APP=$(find build -name "AlloPereNoel.app" -path "*iphonesimulator*" | head -1)
          xcrun simctl install "$UDID" "$APP"
      - name: Capturer
        timeout-minutes: 30
        run: |
          BID=com.padelup.allonoel
          for L in ${{ inputs.langs }}; do
            case "$L" in
              fr) LOC=fr_FR ;; es) LOC=es_ES ;; de) LOC=de_DE ;; it) LOC=it_IT ;; pt-BR) LOC=pt_BR ;; *) LOC=en_US ;;
            esac
            mkdir -p "shots/$L"
            N=0
            for R in ${{ inputs.routes }}; do
              N=$((N+1))
              xcrun simctl terminate "$UDID" "$BID" 2>/dev/null || true
              timeout 60 xcrun simctl launch "$UDID" "$BID" -AppleLanguages "($L)" -AppleLocale "$LOC" -shot "$R" > /dev/null 2>&1 || true
              sleep ${{ inputs.wait }}
              timeout 60 xcrun simctl io "$UDID" screenshot "shots/$L/$(printf %02d $N)-$R.png" > /dev/null 2>>shots/erreurs-captures.txt || true
              xcrun simctl terminate "$UDID" "$BID" 2>/dev/null || true
              echo "$L $R $(date -u +%H:%M:%S)" >> shots/simulateur.txt
            done
          done
          # Le simulateur est arrêté avant la publication : il ne doit plus occuper la machine.
          xcrun simctl shutdown all || true
          ls -laR shots | head -80
      - name: Publier
        if: always()
        timeout-minutes: 10
        env:
          GH_PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p shots && cd shots
          gzip -9 build.log 2>/dev/null || true
          find . -type f -size +40M -print -delete
          du -sh . ; ls -la
          git init -q -b ci-noel-shots
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git config commit.gpgsign false
          git add -A && git commit -qm "Captures Allô Père Noël"
          timeout 420 git push -q -f "https://x-access-token:${GH_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-noel-shots
