# Foldly : fin de la bêta TestFlight
name: Clapet - fin de la bêta
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "probe (voir) ou apply (arrêter)"
        required: true
        default: "probe"
      bundle:
        description: "com.padelup.clapet (Foldly) ou origamo"
        required: false
        default: "com.padelup.clapet"
jobs:
  endbeta:
    runs-on: ubuntu-latest
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
      MODE: ${{ inputs.mode }}
      BUNDLE_ID: ${{ inputs.bundle == 'origamo' && secrets.BUNDLE_ID || inputs.bundle }}
    steps:
      - uses: actions/checkout@v5
      - run: |
          python3 -m pip install --quiet pyjwt cryptography
          python3 clapet/tools/asc_endbeta.py
