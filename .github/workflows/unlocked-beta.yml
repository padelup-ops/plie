# UNLOCKED : texte TestFlight, notes « À tester » et testeurs (internes = les mêmes qu'Origamo).
name: Unlocked - testeurs

on:
  workflow_dispatch:
    inputs:
      build:
        description: "Numéro du build (vide = le dernier)"
        required: false
      public:
        description: "1 = envoyer aussi aux testeurs externes"
        required: false
        default: "0"

jobs:
  beta:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: write
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
      ORIGAMO_BUNDLE_ID: ${{ secrets.BUNDLE_ID }}
      BUILD_NUMBER: ${{ inputs.build }}
      NO_PUBLIC_BETA: ${{ inputs.public == '1' && '0' || '1' }}
    steps:
      - uses: actions/checkout@v5
      - name: Testeurs
        run: |
          python3 -m pip install --quiet pyjwt cryptography
          python3 unlocked/tools/beta.py 2>&1 | tee beta.txt
      - name: Publier le rapport
        if: always()
        env:
          GH_PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/r" && cp beta.txt "$RUNNER_TEMP/r/" 2>/dev/null || echo "pas de rapport" > "$RUNNER_TEMP/r/beta.txt"
          cd "$RUNNER_TEMP/r"
          git init -q -b ci-unlocked-beta
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "Rapport testeurs Unlocked"
          git push -q -f "https://x-access-token:${GH_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-unlocked-beta
