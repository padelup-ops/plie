# ALLÔ PÈRE NOËL : anime le portrait du Père Noël avec sa voix (Ditto, Apache 2.0) sur une carte graphique Kaggle,
# pilotée depuis GitHub. Le compte Kaggle est celui de l'utilisateur (secret KAGGLE_API_TOKEN, nom d'utilisateur en entrée).
# Les vidéos produites sont publiées dans la branche ci-noel-kaggle.
name: Noël - animation (GPU Kaggle)

on:
  workflow_dispatch:
    inputs:
      user:
        description: "Nom d'utilisateur Kaggle (vide = trouvé avec la clé)"
        required: false
        default: ""
      portrait:
        description: "Portrait (chemin dans le dépôt)"
        required: false
        default: "noel/ai/portrait-2.png"
      audios:
        description: "Voix à animer (chemins dans le dépôt, séparés par des espaces)"
        required: false
        default: "noel/ai/essai-fr.wav"
      slug:
        description: "Nom du calcul sur Kaggle"
        required: false
        default: "allo-pere-noel-essai"

jobs:
  kaggle:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KUSER: ${{ inputs.user }}
      SLUG: ${{ inputs.slug }}
      PORTRAIT: ${{ inputs.portrait }}
      AUDIOS: ${{ inputs.audios }}
    steps:
      - name: Préparer le calcul
        run: |
          [ -n "$KAGGLE_API_TOKEN" ] || { echo "::error::Secret KAGGLE_API_TOKEN absent"; exit 1; }
          pip install -q -U kaggle 2>&1 | tail -1
          kaggle --version
          if [ -z "$KUSER" ]; then
            KUSER=$(python3 - <<'EOF'
          from kaggle.api.kaggle_api_extended import KaggleApi
          api = KaggleApi(); api.authenticate()
          u = (getattr(api, "config_values", {}) or {}).get("username") or ""
          if not u:
              try:
                  u = api.get_config_value("username") or ""
              except Exception:
                  pass
          print(u)
          EOF
            )
            [ -n "$KUSER" ] || KUSER=$(kaggle config view 2>/dev/null | awk -F': ' '/username/ {print $2}' | tr -d ' ')
            echo "utilisateur trouvé : ${KUSER:-?}"
            [ -n "$KUSER" ] || { echo "::error::Nom d'utilisateur Kaggle introuvable, à donner en entrée"; exit 1; }
            echo "KUSER=$KUSER" >> "$GITHUB_ENV"
          fi
          mkdir -p k out
          python3 - <<'EOF'
          import json, os
          user, slug = os.environ["KUSER"].strip(), os.environ["SLUG"].strip()
          meta = {"id": f"{user}/{slug}", "title": slug, "code_file": "run.py", "language": "python", "kernel_type": "script",
                  "is_private": True, "enable_gpu": True, "enable_internet": True, "machine_shape": "NvidiaTeslaT4",
                  "dataset_sources": [], "competition_sources": [], "kernel_sources": []}
          json.dump(meta, open("k/kernel-metadata.json", "w"), indent=1)
          audios = os.environ["AUDIOS"].split()
          run = f'''
          import os, subprocess, time, urllib.request, json
          REPO = "https://raw.githubusercontent.com/{os.environ["GITHUB_REPOSITORY"]}/{os.environ["GITHUB_SHA"]}/"
          PORTRAIT = {os.environ["PORTRAIT"]!r}
          AUDIOS = {audios!r}
          W = "/kaggle/working"; OUT = W + "/out"; IN = "/kaggle/in"
          os.makedirs(OUT, exist_ok=True); os.makedirs(IN, exist_ok=True)
          log = open(OUT + "/temps.txt", "a")
          def note(s):
              print(s, flush=True); log.write(s + "\\n"); log.flush()
          def sh(c):
              print("$", c, flush=True); subprocess.run(c, shell=True, check=True)
          sh("nvidia-smi --query-gpu=name,memory.total --format=csv || true")
          sh("apt-get install -y -qq libegl1 libgles2 > /dev/null 2>&1 || true")
          sh("pip install -q librosa tqdm filetype imageio imageio-ffmpeg scikit-image cython colored mediapipe einops onnxruntime huggingface_hub")
          sh("git clone -q --depth 1 https://github.com/antgroup/ditto-talkinghead /kaggle/ditto")
          from huggingface_hub import snapshot_download
          snapshot_download("digital-avatar/ditto-talkinghead", local_dir="/kaggle/ditto/checkpoints",
                            allow_patterns=["ditto_pytorch/*", "ditto_pytorch/**", "ditto_cfg/*"])
          src = IN + "/" + os.path.basename(PORTRAIT)
          urllib.request.urlretrieve(REPO + PORTRAIT, src)
          for a in AUDIOS:
              dst = IN + "/" + os.path.basename(a)
              urllib.request.urlretrieve(REPO + a, dst)
              t = time.time()
              out = OUT + "/" + os.path.splitext(os.path.basename(a))[0] + ".mp4"
              r = subprocess.run(["python", "inference.py", "--data_root", "./checkpoints/ditto_pytorch",
                                  "--cfg_pkl", "./checkpoints/ditto_cfg/v0.4_hubert_cfg_pytorch.pkl",
                                  "--audio_path", dst, "--source_path", src, "--output_path", out],
                                 cwd="/kaggle/ditto", capture_output=True, text=True)
              open(OUT + "/log-" + os.path.basename(a) + ".txt", "w").write(r.stdout[-6000:] + r.stderr[-6000:])
              note(f"{{a}} : {{time.time()-t:.0f}} s, code {{r.returncode}}")
          '''
          import textwrap
          open("k/run.py", "w").write(textwrap.dedent(run))
          EOF
          cat k/kernel-metadata.json
      - name: Lancer sur Kaggle
        run: |
          kaggle kernels push -p k
          REF="$KUSER/$SLUG"; echo "calcul : $REF"
          for i in $(seq 1 280); do
            S=$(kaggle kernels status "$REF" 2>&1 | tail -1); echo "$(date -u +%H:%M) $S"
            echo "$S" | grep -qiE "complete|error|cancel" && break
            sleep 60
          done
          kaggle kernels output "$REF" -p out 2>&1 | tail -5
          ls -laR out | head -40
          cat out/out/temps.txt 2>/dev/null || cat out/temps.txt 2>/dev/null || true
      - name: Publier
        if: always()
        env:
          GH_PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p out && cd out
          find . -type f -size +90M -print -delete
          git init -q -b ci-noel-kaggle
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "Animation Kaggle" && git push -q -f "https://x-access-token:${GH_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-noel-kaggle
