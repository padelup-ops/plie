# FOLDBOARD : lance l'app sur les simulateurs iPhone Duo et iPhone grand écran, et capture les écrans (branche ci-foldboard-shots).
name: Foldboard - captures

on:
  workflow_dispatch:
    inputs:
      routes:
        description: "Écrans à capturer"
        required: false
        default: "right split left themes pro"

jobs:
  shots:
    runs-on: xcode-27
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Choisir Xcode 27.1
        run: |
          XCODE=$(ls -d /Applications/Xcode_27.1*.app 2>/dev/null | grep -v beta | head -1)
          sudo xcode-select -s "${XCODE:-/Applications/Xcode.app}"
      - name: Compiler pour le simulateur
        run: |
          mkdir -p shots
          command -v xcodegen >/dev/null || brew install xcodegen >/dev/null 2>&1
          cd foldboard && xcodegen generate && cd ..
          set -o pipefail
          xcodebuild build -project foldboard/Foldboard.xcodeproj -scheme Foldboard -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO 2>&1 | tee shots/build.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -n -E "error:" shots/build.log | head -60 > shots/erreurs.txt || true
          grep -q "BUILD SUCCEEDED" shots/build.log
      - name: Capturer (Duo et grand iPhone, français et anglais)
        run: |
          APP=$(find build -name "Foldboard.app" -path "*iphonesimulator*" | head -1)
          BID=com.padelup.foldboard
          RUNTIME=$(xcrun simctl list runtimes -j | python3 -c "
          import json, sys
          rs = [r for r in json.load(sys.stdin)['runtimes'] if r.get('platform') == 'iOS' and r.get('isAvailable')]
          print(rs[-1]['identifier'] if rs else '')")
          pick() {
            xcrun simctl list devicetypes -j | python3 -c "
          import json, sys
          want = sys.argv[1]
          d = [x for x in json.load(sys.stdin)['devicetypes'] if want in x['name']]
          print(d[-1]['identifier'] if d else '')" "$1"
          }
          for KIND in duo; do
            if [ $KIND = duo ]; then DT=$(pick Duo); else DT=$(pick "Pro Max"); fi
            echo "$KIND runtime=$RUNTIME device=$DT" | tee -a shots/simulateur.txt
            [ -n "$DT" ] || continue
            UDID=$(xcrun simctl create "Foldboard $KIND" "$DT" "$RUNTIME")
            xcrun simctl boot "$UDID"; xcrun simctl bootstatus "$UDID" -b
            xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 || true
            xcrun simctl install "$UDID" "$APP"
            for L in fr en; do
              N=0
              for R in ${{ inputs.routes }}; do
                N=$((N+1))
                xcrun simctl terminate "$UDID" "$BID" 2>/dev/null || true
                xcrun simctl launch "$UDID" "$BID" -AppleLanguages "($L)" -AppleLocale "${L}_FR" -shot "$R" > /dev/null 2>&1 || true
                sleep 6
                xcrun simctl io "$UDID" screenshot --display=0 "shots/$KIND-$L-$(printf %02d $N)-$R-in.png" 2>>shots/erreurs-captures.txt || true
                xcrun simctl io "$UDID" screenshot --display=1 "shots/$KIND-$L-$(printf %02d $N)-$R-out.png" 2>>shots/erreurs-captures.txt || true
              done
            done
            xcrun simctl shutdown "$UDID" || true
          done
          ls -la shots
      - name: Publier
        if: always()
        env:
          GH_PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd shots
          git init -q -b ci-foldboard-shots
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "Captures Foldboard" && git push -q -f "https://x-access-token:${GH_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-foldboard-shots
