# Remplit la fiche App Store de la version en préparation (textes de tools/store_listing.json).
# Ne soumet rien à Apple. Le compte rendu est publié dans la branche ci-asc-fiche (fiche.txt).

name: App Store Connect (fiche)

on:
  workflow_dispatch:

jobs:
  fiche:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
      BUNDLE_ID: ${{ secrets.BUNDLE_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Remplir la fiche
        run: |
          pip install --quiet pyjwt cryptography
          python3 tools/asc_fiche.py 2>&1 | tee fiche.txt
      - name: Publier le compte rendu
        if: always()
        env:
          GH_PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p out && cp fiche.txt out/ && cd out
          git init -q -b ci-asc-fiche
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "Fiche App Store"
          git push -q -f "https://x-access-token:${GH_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-asc-fiche
