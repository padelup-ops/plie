# RetroFold : compile les cœurs GBA (mGBA) et DS (melonDS DS) pour l'iPhone et les range dans la branche ci-retrofold-cores,
# où la compilation de l'app vient les chercher.
# Avec « switch » : compile à la place l'émulateur Switch libre MeloNX en .ipa non signée, pour un usage personnel
# (jamais envoyée à Apple) ; elle se télécharge dans les fichiers joints de l'exécution.
name: RetroFold - cœurs GBA et DS

on:
  workflow_dispatch:
    inputs:
      only:
        description: "gba, ds, vide (les deux) ; ou switch (l'émulateur Switch, non signé), switch-appareils (iPhone enregistrés), switch-installer (signé pour l'iPhone du champ device), switch-liens (liens d'installation)"
        required: false
      platform:
        description: "vide : iPhone ; sim : simulateur (rangés dans sim/)"
        required: false
      device:
        description: "switch-installer seulement : identifiant (UDID) de l'iPhone qui recevra l'app Switch"
        required: false
      switch_source:
        description: "switch seulement : autre dépôt et version, « adresse version » (vide : la copie fixée dans build_switch.sh)"
        required: false

jobs:
  cores:
    if: ${{ !startsWith(inputs.only, 'switch') }}
    runs-on: xcode-27
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Choisir Xcode 27.1
        run: |
          XCODE=$(ls -d /Applications/Xcode_27.1*.app 2>/dev/null | grep -v beta | head -1)
          sudo xcode-select -s "${XCODE:-/Applications/Xcode.app}"
      - name: Compiler
        env:
          ONLY: ${{ inputs.only }}
          PLATFORM: ${{ inputs.platform }}
        run: |
          set -o pipefail
          bash retrofold/tools/build_cores.sh 2>&1 | tee cores.log | grep -E "error|Error|===|framework|retro_|arm64|Built target" | tail -80
      - name: Erreurs
        if: failure()
        run: grep -n -B3 -A8 -E "error:|Error " cores.log | head -200 || true
      - name: Publier
        if: always()
        env:
          GH_PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p pub && cd pub
          git init -q -b ci-retrofold-cores
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q origin ci-retrofold-cores 2>/dev/null; then git checkout -q -B ci-retrofold-cores FETCH_HEAD; fi
          for f in ../retrofold/Cores/*.framework; do [ -e "$f" ] || continue; rm -rf "$(basename "$f")"; cp -R "$f" .; done
          mkdir -p sim
          for f in ../retrofold/CoresSim/*.framework; do [ -e "$f" ] || continue; rm -rf "sim/$(basename "$f")"; cp -R "$f" sim/; done
          git add -A && git commit -qm "Cœurs GBA / DS" && git push -q -f origin ci-retrofold-cores || true
          ls

  switch:
    if: inputs.only == 'switch'
    runs-on: xcode-27
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Choisir Xcode 27.1
        run: |
          XCODE=$(ls -d /Applications/Xcode_27.1*.app 2>/dev/null | grep -v beta | head -1)
          sudo xcode-select -s "${XCODE:-/Applications/Xcode.app}"
          xcodebuild -version
      - name: Compiler
        env:
          SOURCE: ${{ inputs.switch_source }}
        run: |
          set -o pipefail
          if [ -n "$SOURCE" ]; then export SWITCH_REPO="${SOURCE%% *}" SWITCH_REV="${SOURCE##* }"; fi
          bash retrofold/tools/build_switch.sh 2>&1 | tee switch.log | grep -E "^===|^SDK|error|Error|fatal|warning: Compiling|BUILD (SUCCEEDED|FAILED)|\.ipa|dylib|\.framework$|^[0-9]+\.[0-9]+" | tail -120
      - name: Erreurs
        if: failure()
        run: |
          grep -n -B2 -A6 -E "error:|error [A-Z]+[0-9]+|BUILD FAILED" switch.log | head -300 || true
          echo "----- fin du journal"; tail -60 switch.log
      - name: Joindre l'app
        uses: actions/upload-artifact@v4
        with:
          name: RetroFoldSwitch
          path: |
            retrofold/Switch/RetroFoldSwitch.ipa
            retrofold/Switch/entitlements.plist
            retrofold/Switch/LICENSE-MeloNX.txt
          if-no-files-found: error

  # Lecture seule : les iPhone déjà enregistrés sur le compte développeur (pour signer l'app Switch pour l'un d'eux).
  switch-appareils:
    if: inputs.only == 'switch-appareils'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v5
      - run: python3 -m pip install --quiet pyjwt cryptography
      - run: python3 retrofold/tools/switch_sign.py appareils

  # L'émulateur Switch et StikDebug, signés « développement » pour un iPhone : installables sans ordinateur, sans passer
  # par la vérification d'Apple. Enregistre l'iPhone sur le compte s'il n'y est pas et crée un certificat de développement.
  switch-installer:
    if: inputs.only == 'switch-installer'
    runs-on: xcode-27
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
      BUNDLE_ID: ${{ secrets.BUNDLE_ID }}
    steps:
      - uses: actions/checkout@v5
      - name: Choisir Xcode 27.1
        run: |
          XCODE=$(ls -d /Applications/Xcode_27.1*.app 2>/dev/null | grep -v beta | head -1)
          sudo xcode-select -s "${XCODE:-/Applications/Xcode.app}"
      - name: Compiler et signer
        env:
          DEVICE: ${{ inputs.device }}
        run: |
          set -o pipefail
          test -n "$DEVICE" || { echo "Il manque l'identifiant de l'iPhone (champ device)"; exit 1; }
          echo "::add-mask::$DEVICE"
          python3 -m pip install --quiet --user pyjwt cryptography >/dev/null 2>&1 || python3 -m pip install --quiet --break-system-packages pyjwt cryptography
          bash retrofold/tools/switch_install.sh "$DEVICE" 2>&1 | tee installer.log | grep -E "^===|^ok|^note|^ÉCHEC|^droits|error|Error|fatal|BUILD (SUCCEEDED|FAILED)|ARCHIVE (SUCCEEDED|FAILED)|\.ipa" | tail -120
      - name: Erreurs
        if: failure()
        run: |
          grep -n -B2 -A6 -E "error:|ÉCHEC|BUILD FAILED|ARCHIVE FAILED" installer.log | head -200 || true
          echo "----- fin du journal"; tail -40 installer.log
      - name: Joindre l'émulateur signé
        uses: actions/upload-artifact@v7
        with:
          path: retrofold/Switch/RetroFoldSwitch-signee.ipa
          archive: false
          retention-days: 7
      - name: Joindre StikDebug signé
        uses: actions/upload-artifact@v7
        with:
          path: retrofold/Switch/RetroFoldStikDebug-signee.ipa
          archive: false
          retention-days: 7

  # Les liens d'installation des deux apps signées : ils pointent sur des adresses temporaires de GitHub, à refaire à
  # chaque fois (elles expirent au bout de quelques minutes).
  switch-liens:
    if: inputs.only == 'switch-liens'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    env:
      BUNDLE_ID: ${{ secrets.BUNDLE_ID }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - run: python3 retrofold/tools/switch_sign.py liens liens
      - uses: actions/upload-artifact@v7
        with:
          path: liens/switch-manifest.plist
          archive: false
          retention-days: 1
      - uses: actions/upload-artifact@v7
        with:
          path: liens/stikdebug-manifest.plist
          archive: false
          retention-days: 1
