# RetroFold : compile les cœurs GBA (mGBA) et DS (melonDS DS) pour l'iPhone et les range dans la branche ci-retrofold-cores,
# où la compilation de l'app vient les chercher.
# Avec « switch » : compile à la place l'émulateur Switch libre MeloNX en .ipa non signée, pour un usage personnel
# (jamais envoyée à Apple) ; elle se télécharge dans les fichiers joints de l'exécution.
name: RetroFold - cœurs GBA et DS

on:
  workflow_dispatch:
    inputs:
      only:
        description: "gba, ds, vide (les deux) ou switch (l'émulateur Switch, à part)"
        required: false
      platform:
        description: "vide : iPhone ; sim : simulateur (rangés dans sim/)"
        required: false
      switch_source:
        description: "switch seulement : autre dépôt et version, « adresse version » (vide : la copie fixée dans build_switch.sh)"
        required: false

jobs:
  cores:
    if: inputs.only != 'switch'
    runs-on: xcode-27
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Choisir Xcode 27.1
        run: |
          XCODE=$(ls -d /Applications/Xcode_27.1*.app 2>/dev/null | grep -v beta | head -1)
          sudo xcode-select -s "${XCODE:-/Applications/Xcode.app}"
      - name: Compiler
        env:
          ONLY: ${{ inputs.only }}
          PLATFORM: ${{ inputs.platform }}
        run: |
          set -o pipefail
          bash retrofold/tools/build_cores.sh 2>&1 | tee cores.log | grep -E "error|Error|===|framework|retro_|arm64|Built target" | tail -80
      - name: Erreurs
        if: failure()
        run: grep -n -B3 -A8 -E "error:|Error " cores.log | head -200 || true
      - name: Publier
        if: always()
        env:
          GH_PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p pub && cd pub
          git init -q -b ci-retrofold-cores
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q origin ci-retrofold-cores 2>/dev/null; then git checkout -q -B ci-retrofold-cores FETCH_HEAD; fi
          for f in ../retrofold/Cores/*.framework; do [ -e "$f" ] || continue; rm -rf "$(basename "$f")"; cp -R "$f" .; done
          mkdir -p sim
          for f in ../retrofold/CoresSim/*.framework; do [ -e "$f" ] || continue; rm -rf "sim/$(basename "$f")"; cp -R "$f" sim/; done
          git add -A && git commit -qm "Cœurs GBA / DS" && git push -q -f origin ci-retrofold-cores || true
          ls

  switch:
    if: inputs.only == 'switch'
    runs-on: xcode-27
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Choisir Xcode 27.1
        run: |
          XCODE=$(ls -d /Applications/Xcode_27.1*.app 2>/dev/null | grep -v beta | head -1)
          sudo xcode-select -s "${XCODE:-/Applications/Xcode.app}"
          xcodebuild -version
      - name: Compiler
        env:
          SOURCE: ${{ inputs.switch_source }}
        run: |
          set -o pipefail
          if [ -n "$SOURCE" ]; then export SWITCH_REPO="${SOURCE%% *}" SWITCH_REV="${SOURCE##* }"; fi
          bash retrofold/tools/build_switch.sh 2>&1 | tee switch.log | grep -E "^===|^SDK|error|Error|fatal|warning: Compiling|BUILD (SUCCEEDED|FAILED)|\.ipa|dylib|\.framework$|^[0-9]+\.[0-9]+" | tail -120
      - name: Erreurs
        if: failure()
        run: |
          grep -n -B2 -A6 -E "error:|error [A-Z]+[0-9]+|BUILD FAILED" switch.log | head -300 || true
          echo "----- fin du journal"; tail -60 switch.log
      - name: Joindre l'app
        uses: actions/upload-artifact@v4
        with:
          name: RetroFoldSwitch
          path: |
            retrofold/Switch/RetroFoldSwitch.ipa
            retrofold/Switch/entitlements.plist
            retrofold/Switch/LICENSE-MeloNX.txt
          if-no-files-found: error
