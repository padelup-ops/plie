# FOLDBOARD : peut-on faire tourner les modèles FUTO Swipe (.pte) dans le clavier iPhone avec ExecuTorch ?
# Étape 1 : trouver le paquet Swift d'ExecuTorch, ses frameworks et leur API.
name: Foldboard - Sonde ExecuTorch
on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branche swiftpm d'ExecuTorch (vide = la plus récente)"
        required: false
        default: ""
jobs:
  probe:
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - name: Paquet Swift
        run: |
          mkdir -p et && cd et
          git ls-remote https://github.com/pytorch/executorch 'refs/heads/swiftpm-*' | awk '{print $2}' | sed 's#refs/heads/##' | grep -E '^swiftpm-[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -6 | tee branches.txt
          B="${{ inputs.branch }}"; [ -z "$B" ] && B=$(tail -1 branches.txt)
          echo "BRANCH=$B" >> "$GITHUB_ENV"
          curl -sL "https://raw.githubusercontent.com/pytorch/executorch/$B/Package.swift" > Package.swift
          sed -n 1,135p Package.swift; sed -n 155,170p Package.swift
      - name: Frameworks
        run: |
          cd et
          python3 - <<'EOF'
          import re, subprocess
          s = open('Package.swift').read()
          url = re.search(r'let url = "([^"]+)"', s).group(1)
          version = re.search(r'let version = "([^"]+)"', s).group(1)
          keys = re.findall(r'^\s*"([a-z_]+)"\s*:\s*\[', s, re.M)
          print('url', url, 'version', version, 'keys', keys)
          for k in keys:
              if any(x in k for x in ('executorch', 'xnnpack', 'kernels_optimized', 'kernels_portable', 'threadpool', 'kleidiai')) and 'llm' not in k and 'dump' not in k:
                  u = f"{url}{k}-{version}.zip"
                  print('get', u)
                  subprocess.run(['curl', '-sfL', '-o', f"{k}.zip", u], check=False)
          EOF
          for z in *.zip; do [ -f "$z" ] && unzip -q -o "$z" -d fw; done; mkdir -p fw
          ls fw; du -sh fw/* | head -20
          find fw -name "*.h" | grep -iE "module|tensor|value|ExecuTorch\.h" | head -20
          for h in $(find fw -path "*ios-arm64-simulator*" -name "*.h" | grep -iE "Module\.h|Tensor\.h|Value\.h" | head -6); do echo "== $h"; grep -nE "NS_SWIFT_NAME|^- \(|^\+ \(|@interface|initWith" "$h" | head -40; done
          S=fw/executorch.xcframework/ios-arm64-simulator
          ls $S; find $S -maxdepth 2 | head -20; cat $S/Headers/module.modulemap 2>/dev/null || find fw -name "module.modulemap" | head
          for h in ExecuTorchModule.h ExecuTorchTensor.h ExecuTorch.h; do echo "=== $h"; grep -vE "^\s*\*|^\s*/\*\*|^\s*$|^//" $S/Headers/ExecuTorch/$h | head -150; done
          for x in fw/*.xcframework; do echo "== $x"; ls $x; ls $x/ios-arm64-simulator | head; done
      - name: Modèle
        run: |
          cd et
          curl -sL -o enc32.pte https://huggingface.co/futo-org/futo-swipe/resolve/main/honorable_sturgeon/model_fp32.pte
          curl -sL -o enc8.pte https://huggingface.co/futo-org/futo-swipe/resolve/main/honorable_sturgeon/model_int8.pte
          ls -la *.pte; for f in *.pte; do echo "== $f"; strings "$f" | grep -iE "xnnpack|backend|aten::|_ops\." | sort | uniq -c | sort -rn | head -25; done
      - uses: actions/checkout@v5
        with:
          path: src
      - name: Essai sur le simulateur
        run: |
          cd et
          S=ios-arm64-simulator
          grep -nE "public (func|init|convenience init|final class|class|struct|subscript|var)" fw/executorch.xcframework/$S/ExecuTorch.swiftinterface | head -80
          for x in fw/*.xcframework; do ls $x/$S/*.a; done
          LIBS=""; for x in fw/*.xcframework; do for a in $x/$S/*.a; do LIBS="$LIBS -Xlinker -force_load -Xlinker $a"; done; done
          set -o pipefail
          xcrun --sdk iphonesimulator swiftc -O -target arm64-apple-ios27.0-simulator \
            -I fw/executorch.xcframework/$S/Headers ../src/foldboard/tools/swipe/et_smoke.swift $LIBS \
            -lc++ -framework Accelerate -framework CoreML -framework CoreGraphics -framework CoreImage -framework CoreVideo -lsqlite3 \
            -o smoke 2>&1 | grep -E "error|warning: unre|undefined" | head -40
          ls -la smoke
          DEV=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if 'iPhone' in x['name']))")
          xcrun simctl boot "$DEV" || true; xcrun simctl bootstatus "$DEV" -b > /dev/null
          for m in enc32.pte enc8.pte; do echo "== $m"; xcrun simctl spawn "$DEV" "$PWD/smoke" "$PWD/$m"; done
