# One-shot check: wait until the uploaded Twinfold build leaves Apple's processing queue.
# Does not upload, and does not submit for review.

name: Twinfold - processing

on:
  push:
    branches: [cursor/twinfold-hand-fullscreen-7973]
    paths: [".github/workflows/twinfold-processing.yml"]

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
    steps:
      - name: Wait until build 51 is processed
        run: |
          python3 -m pip install --quiet pyjwt cryptography
          python3 - << 'PY'
          import json, os, time, urllib.request, urllib.error
          import jwt
          API = "https://api.appstoreconnect.apple.com"
          key = os.environ["ASC_PRIVATE_KEY"]
          def token():
              return jwt.encode(
                  {"iss": os.environ["ASC_ISSUER_ID"], "iat": int(time.time()), "exp": int(time.time()) + 1100, "aud": "appstoreconnect-v1"},
                  key, algorithm="ES256", headers={"kid": os.environ["ASC_KEY_ID"], "typ": "JWT"})
          def call(path):
              req = urllib.request.Request(API + path, headers={"Authorization": "Bearer " + token()})
              try:
                  with urllib.request.urlopen(req) as r:
                      return json.loads(r.read())
              except urllib.error.HTTPError as e:
                  return {"error": e.code, "detail": e.read().decode()[:500]}
          apps = call("/v1/apps?filter[bundleId]=com.padelup.twinfold&limit=1")
          if "data" not in apps or not apps["data"]:
              print("NO APP", apps)
              raise SystemExit(1)
          app = apps["data"][0]["id"]
          deadline = time.time() + 35 * 60
          while time.time() < deadline:
              data = call(f"/v1/builds?filter[app]={app}&filter[version]=51&limit=5&fields[builds]=version,processingState,uploadedDate")
              if "error" in data:
                  print("API", data["error"])
                  time.sleep(20)
                  continue
              builds = data.get("data") or []
              if not builds:
                  print("waiting for build 51 to appear")
                  time.sleep(30)
                  continue
              state = builds[0]["attributes"].get("processingState")
              print("build", builds[0]["attributes"].get("version"), state)
              if state == "VALID":
                  raise SystemExit(0)
              if state in ("FAILED", "INVALID"):
                  raise SystemExit(2)
              time.sleep(30)
          print("still processing")
          raise SystemExit(3)
          PY
