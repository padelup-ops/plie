# ALLÔ PÈRE NOËL : voix de Père Noël « dessin animé », chaleureuse et joviale.
# Kokoro (Apache 2.0) a des voix de Père Noël toutes faites (am_santa en anglais, em_santa en espagnol, pm_santa en
# portugais). Pour le français, l'allemand et l'italien, Chatterbox Multilingual (MIT) reprend ce timbre de Père Noël,
# avec plus ou moins d'entrain. Aucune voix de personne réelle, aucune retouche de hauteur.
name: Noël - voix dessin animé

on:
  workflow_dispatch:
    inputs:
      langs:
        description: "Langues (fr en es de it pt)"
        required: false
        default: "fr en"
      chatterbox:
        description: "Aussi Chatterbox (1/0)"
        required: false
        default: "1"

jobs:
  voices:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installer
        run: |
          sudo apt-get install -y -qq espeak-ng ffmpeg > /dev/null
          pip install -q --extra-index-url https://download.pytorch.org/whl/cpu chatterbox-tts 2>&1 | tail -2
          pip install -q --extra-index-url https://download.pytorch.org/whl/cpu kokoro soundfile 2>&1 | tail -2
      - name: Voix
        env:
          LANGS: ${{ inputs.langs }}
          CHATTERBOX: ${{ inputs.chatterbox }}
        run: |
          mkdir -p out
          cat > v.py <<'EOF'
          import os, time, numpy as np, soundfile as sf, torch
          _load = torch.load
          def _cpu_load(*a, **k):
              k.setdefault("map_location", "cpu")
              return _load(*a, **k)
          torch.load = _cpu_load
          langs = (os.environ.get("LANGS") or "fr en").split()
          log = open("out/notes.txt", "a")
          def note(s):
              print(s, flush=True); log.write(s + "\n"); log.flush()
          TEXT = {
              "fr": "Ho, ho, ho ! Bonjour Léa ! C'est moi, le Père Noël ! Je t'appelle depuis mon atelier, au pôle Nord. Tu sais, on m'a dit que tu as un grand cœur. C'est merveilleux !",
              "en": "Ho, ho, ho! Hello, Emma! It's me, Santa Claus! I'm calling from my workshop at the North Pole. You know, they told me you have a big heart. That's wonderful!",
              "es": "¡Jo, jo, jo! ¡Hola, Lucía! ¡Soy yo, Papá Noel! Te llamo desde mi taller, en el Polo Norte. ¿Sabes? Me han contado que tienes un gran corazón. ¡Es maravilloso!",
              "de": "Ho, ho, ho! Hallo, Emma! Ich bin's, der Weihnachtsmann! Ich rufe dich aus meiner Werkstatt am Nordpol an. Weißt du, man hat mir erzählt, dass du ein großes Herz hast. Das ist wunderbar!",
              "it": "Oh, oh, oh! Ciao, Giulia! Sono io, Babbo Natale! Ti chiamo dal mio laboratorio, al Polo Nord. Sai, mi hanno detto che hai un cuore grande. È meraviglioso!",
              "pt": "Ho, ho, ho! Olá, Alice! Sou eu, o Papai Noel! Estou ligando da minha oficina, lá no Polo Norte. Sabe, me contaram que você tem um coração enorme. Que maravilha!",
          }
          from kokoro import KPipeline
          def kokoro(lang_code, voice, text, speed=0.92):
              p = KPipeline(lang_code=lang_code)
              parts = [a for _, _, a in p(text, voice=voice, speed=speed)]
              return np.concatenate([x.numpy() if hasattr(x, "numpy") else x for x in parts]).astype(np.float32)

          # Les voix de Père Noël de Kokoro (am_santa, em_santa, pm_santa), dans chaque langue que Kokoro sait lire
          codes = {"en": "a", "es": "e", "pt": "p", "fr": "f", "it": "i"}
          for lang in langs:
              if lang not in codes:
                  continue
              for voice in ("am_santa", "em_santa", "pm_santa"):
                  t = time.time()
                  try:
                      y = kokoro(codes[lang], voice, TEXT[lang])
                  except Exception as e:
                      note(f"{lang} kokoro {voice} : échec {e}")
                      continue
                  sf.write(f"out/{lang}-kokoro-{voice}.wav", y, 24000)
                  note(f"{lang} kokoro {voice} : {len(y)/24000:.1f} s en {time.time()-t:.0f} s")
          if os.environ.get("CHATTERBOX", "1") == "0":
              raise SystemExit
          # Le timbre de référence pour Chatterbox : le Père Noël de Kokoro, en anglais
          ref_text = ("Ho, ho, ho! Merry Christmas! Oh, what a wonderful night it is here at the North Pole. "
                      "The elves are singing, the reindeer are ready, and I have a big bag full of surprises. Ho, ho, ho!")
          sf.write("out/reference-santa.wav", kokoro("a", "am_santa", ref_text, speed=0.9), 24000)

          from chatterbox.mtl_tts import ChatterboxMultilingualTTS
          m = ChatterboxMultilingualTTS.from_pretrained(device="cpu")
          for lang in langs:
              for name, ex, cfgw in (("jovial", 0.75, 0.35), ("tres-jovial", 0.95, 0.3)):
                  t = time.time()
                  wav = m.generate(TEXT[lang], language_id=lang, audio_prompt_path="out/reference-santa.wav",
                                   exaggeration=ex, cfg_weight=cfgw, temperature=0.75)
                  w = wav.squeeze().cpu().numpy()
                  sf.write(f"out/{lang}-chatterbox-{name}.wav", w, m.sr)
                  note(f"{lang} chatterbox {name} : {len(w)/m.sr:.1f} s en {time.time()-t:.0f} s")
          EOF
          python v.py 2>&1 | grep -v -i "warn" | tail -40 || true
          cd out && for f in *.wav; do ffmpeg -v error -y -i "$f" -c:a aac -b:a 128k "${f%.wav}.m4a"; done; ls -la
      - name: Publier
        if: always()
        env:
          GH_PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p out && cd out
          git init -q -b ci-noel-voices-cartoon
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "Voix dessin animé" && git push -q -f "https://x-access-token:${GH_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-noel-voices-cartoon
