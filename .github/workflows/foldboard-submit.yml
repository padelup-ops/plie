# Envoie une version de Foldboard (ou de Vicefold, par son bundle) à la vérification (sortie automatique après accord). Ne change pas le prix.
name: Envoyer une app à la vérification

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (ex. 1.0.23)"
        required: true
      build:
        description: "Numéro de build"
        required: true
      bundle:
        description: "Bundle (com.padelup.foldboard par défaut)"
        required: false
      meta:
        description: "Fiche (tools/meta/....json)"
        required: false
      whats_new:
        description: "Nouveautés à part (JSON locale → texte)"
        required: false
      review_notes:
        description: "Note pour Apple (JSON avec reviewNotes)"
        required: false
      set_listing:
        description: "1 : met aussi à jour description, mots-clés, texte promo"
        required: false
      cancel_pending:
        description: "1 : retire d'abord la demande en attente ; only : la retire sans rien renvoyer"
        required: false
      dry_run:
        description: "Vicefold seulement, 1 : essai à blanc, lit tout sans rien écrire"
        required: false

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_BUILD: ${{ inputs.build }}
      BUNDLE: ${{ inputs.bundle }}
      META: ${{ inputs.meta || 'tools/meta/foldboard.json' }}
      WHATS_NEW: ${{ inputs.whats_new }}
      REVIEW_NOTES: ${{ inputs.review_notes }}
      SET_LISTING: ${{ inputs.set_listing }}
      CANCEL_PENDING: ${{ inputs.cancel_pending }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - uses: actions/checkout@v5
      - name: Envoyer
        run: |
          python3 -m pip install --quiet pyjwt cryptography
          # Vicefold a son propre envoi : lien et champ EULA, achats joints, première sortie sans « nouveautés ».
          if [ "$BUNDLE" = "com.padelup.vicefold" ]; then
            python3 vicefold/tools/submit.py
          else
            python3 foldboard/tools/asc_submit.py
          fi
