# TWINFOLD : captures sur le simulateur iPhone Duo (écran intérieur et extérieur), pour la fiche App Store.
# L'app est lancée avec « -shot nom » (voir ShotMode.swift) et ouvre des pages d'exemple intégrées.
name: Twinfold - captures

on:
  workflow_dispatch:
    inputs:
      routes:
        description: "Captures (séparées par des espaces)"
        required: false
        default: "split start news tabs pairs single"
      wait:
        description: "Secondes de jeu avant chaque capture"
        required: false
        default: "9"
      pose:
        description: "open (écran intérieur) ou close (écran extérieur)"
        required: false
        default: "open"
      orient:
        description: "Orientations du simulateur à essayer, séparées par des espaces (portrait, landscapeLeft, landscapeRight, portraitUpsideDown) ; vide = telle quelle"
        required: false
        default: ""
      record:
        description: "Secondes de vidéo à filmer sur l'écran intérieur pour chaque capture (vide = images seulement)"
        required: false
        default: ""
      device:
        description: "Simulateur (partie du nom : Duo, iPhone 17 Pro Max, iPad Pro 13)"
        required: false
        default: "Duo"
      resize:
        description: "Taille en points pour le mode redimensionnable (ex. 669x951 : l'écran intérieur tenu en portrait) ; vide = captures normales"
        required: false
        default: ""

jobs:
  shots:
    runs-on: xcode-27
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Choisir Xcode 27.1
        run: |
          XCODE=$(ls -d /Applications/Xcode_27.1*.app 2>/dev/null | grep -v beta | head -1)
          sudo xcode-select -s "${XCODE:-/Applications/Xcode.app}"
      - name: Compiler et installer sur le simulateur
        env:
          DEVICE: ${{ inputs.device }}
        run: |
          mkdir -p shots
          find_runtime() {
            xcrun simctl list runtimes -j | python3 -c "
          import json, os, sys
          rs = [r for r in json.load(sys.stdin)['runtimes']
                if r.get('platform') == 'iOS' and r.get('isAvailable')
                and any(os.environ['DEVICE'] in d.get('name', '') for d in r.get('supportedDeviceTypes', []))]
          print(rs[-1]['identifier'] if rs else '')"
          }
          RUNTIME=$(find_runtime)
          if [ -z "$RUNTIME" ]; then xcodebuild -downloadPlatform iOS 2>&1 | tail -3; RUNTIME=$(find_runtime); fi
          DT=$(xcrun simctl list devicetypes -j | python3 -c "
          import json, os, sys
          d = [x for x in json.load(sys.stdin)['devicetypes'] if os.environ['DEVICE'] in x['name']]
          print(d[0]['identifier'] if d else '')")
          echo "runtime=$RUNTIME device=$DT" | tee shots/simulateur.txt
          UDID=$(xcrun simctl create "Twinfold Duo" "$DT" "$RUNTIME")
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"; xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 || true
          set -o pipefail
          if ! command -v xcodegen >/dev/null; then brew install xcodegen >/dev/null 2>&1 || true; fi
          (cd twinfold && xcodegen generate)
          xcodebuild build -project twinfold/Twinfold.xcodeproj -scheme Twinfold -configuration Debug -sdk iphonesimulator \
            -destination "id=$UDID" -derivedDataPath build CODE_SIGNING_ALLOWED=NO 2>&1 | tee shots/build.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -n -E "error:" shots/build.log | head -60 > shots/erreurs.txt || true
          grep -q "BUILD SUCCEEDED" shots/build.log
          APP=$(find build -name "Twinfold.app" -path "*iphonesimulator*" | head -1)
          xcrun simctl install "$UDID" "$APP"
          # Plier ou déplier le simulateur (outil libre duo-hinge, récupéré au moment du job, jamais copié dans le dépôt)
          if [ "$DEVICE" != "Duo" ]; then exit 0; fi
          git clone -q --depth 1 https://github.com/BugenZhao/duo-hinge-skill "$RUNNER_TEMP/hinge"
          DUO_HINGE_DEVICE=$UDID "$RUNNER_TEMP/hinge/scripts/duo-hinge" ${{ inputs.pose }} 2>&1 | tail -3 | tee -a shots/simulateur.txt || true
          sleep 3
          DUO_HINGE_DEVICE=$UDID "$RUNNER_TEMP/hinge/scripts/duo-hinge" status 2>&1 | tail -5 | tee -a shots/simulateur.txt || true
      - name: Capturer
        timeout-minutes: 25
        run: |
          BID=com.padelup.twinfold
          ORIENTS="${{ inputs.orient != '' && inputs.orient || 'none' }}"
          LAST=$(echo $ORIENTS | awk '{print $NF}')
          for O in $ORIENTS; do
            if [ "$O" != "none" ]; then
              xcrun devicectl device orientation set --device "$UDID" "$O" 2>&1 | tail -2 | tee -a shots/simulateur.txt || true
              sleep 4
              SUF="-o$O"
            else
              SUF=""
            fi
            # Avec plusieurs orientations, seules les captures de la dernière comptent quand on filme.
            if [ -n "${{ inputs.record }}" ] && [ "$O" != "$LAST" ]; then continue; fi
            N=0
            for R in ${{ inputs.routes }}; do
              N=$((N+1))
              xcrun simctl terminate "$UDID" "$BID" 2>/dev/null || true
              xcrun simctl launch "$UDID" "$BID" -AppleLanguages "(en)" -shot "$R" > /dev/null 2>&1 || true
              if [ -n "${{ inputs.resize }}" ]; then
                sleep 3
                DUO_HINGE_DEVICE=$UDID "$RUNNER_TEMP/hinge/scripts/duo-hinge" resize start ${{ inputs.resize }} 2>&1 | tail -2 | tee -a shots/simulateur.txt || true
                sleep ${{ inputs.wait }}
                xcrun simctl io "$UDID" screenshot --display=resizable "shots/$(printf %02d $N)-$R-dresizable.png" > /dev/null 2>>shots/erreurs-captures.txt || true
                DUO_HINGE_DEVICE=$UDID "$RUNNER_TEMP/hinge/scripts/duo-hinge" resize stop 2>&1 | tail -1 >> shots/simulateur.txt || true
                continue
              fi
              if [ -n "${{ inputs.record }}" ]; then
                sleep 3
                OUT="shots/$(printf %02d $N)-$R$SUF.mp4"
                SIMCTL=$(xcrun -f simctl)
                # Sans contrôle des tâches, bash fait ignorer Ctrl+C (SIGINT) aux commandes lancées en arrière-plan :
                # simctl ne s'arrêterait jamais. « set -m » le rétablit.
                set -m
                "$SIMCTL" io "$UDID" recordVideo --display=primary-1 --codec=h264 --force "$OUT" > /dev/null 2>>shots/erreurs-captures.txt &
                RP=$!
                set +m
                sleep ${{ inputs.record }}
                kill -INT $RP 2>/dev/null || true
                for k in $(seq 1 40); do kill -0 $RP 2>/dev/null || break; sleep 0.5; done
                kill -9 $RP 2>/dev/null || true
                rm -f shots/*.sb-* 2>/dev/null || true
                # Copie plus légère (largeur 1004 px) pour l'envoyer dans le dépôt.
                if command -v ffmpeg >/dev/null; then
                  ffmpeg -v error -y -i "$OUT" -vf scale=1004:-2 -c:v libx264 -crf 20 -preset veryfast -an "${OUT%.mp4}-s.mp4" && rm -f "$OUT"
                else
                  avconvert -s "$OUT" -o "${OUT%.mp4}-s.mp4" -p Preset1280x720 --replace > /dev/null 2>&1 && rm -f "$OUT"
                fi
                echo "vidéo $OUT : $(ls -la "${OUT%.mp4}-s.mp4" "$OUT" 2>/dev/null | awk '{print $5}' | tr '\n' ' ') octets" | tee -a shots/simulateur.txt
              fi
              sleep ${{ inputs.wait }}
              xcrun devicectl device info displays --device "$UDID" 2>/dev/null | grep -o 'Main display orientation: [a-zA-Z]*' | sed "s/^/$R$SUF : /" >> shots/simulateur.txt || true
              for D in primary primary-1; do xcrun simctl io "$UDID" screenshot --display=$D --mask=black "shots/$(printf %02d $N)-$R$SUF-d$D.png" > /dev/null 2>>shots/erreurs-captures.txt || true; done
            done
          done
          ls -la shots; command -v ffmpeg avconvert || true
      - name: Journal de l'app (essais)
        if: always()
        run: |
          D=$(xcrun simctl get_app_container "$UDID" com.padelup.twinfold data 2>/dev/null || true)
          [ -n "$D" ] && cat "$D/Documents/twinfold-test.txt" 2>/dev/null | tee shots/essai.txt || echo "pas de journal" | tee shots/essai.txt
      - name: Vidéos (artefact)
        if: always() && inputs.record != ''
        uses: actions/upload-artifact@v4
        with:
          name: twinfold-videos
          path: shots/*-s.mp4
          retention-days: 3
          if-no-files-found: warn
      - name: Publier
        if: always()
        env:
          GH_PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p shots && cd shots
          rm -f *.sb-*
          find . -type f -size +90M -print -delete
          git init -q -b ci-twinfold-shots
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "Captures Twinfold"
          git push -q -f "https://x-access-token:${GH_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-twinfold-shots
