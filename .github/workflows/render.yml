# Assemble les morceaux rendus (run RENDER_RUN) : film avec musique, en-tête et recherche, puis les publie sur ci-foldboard-video-out.
name: Foldboard - assemblage vidéo

on:
  push:
    branches: [ci-foldboard-video-src]

permissions:
  contents: write
  actions: read

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          run-id: 42639403630
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: parts
      - name: Montage
        run: |
          sudo apt-get install -y ffmpeg >/dev/null 2>&1 || (sudo apt-get update >/dev/null && sudo apt-get install -y ffmpeg >/dev/null)
          mkdir -p out
          for name in film-fr film-en wide-fr wide-en tall-fr tall-en; do
            : > $name.txt
            for i in 0 1 2 3 4 5 6 7; do [ -f parts/$name-$i/part.mp4 ] && echo "file 'parts/$name-$i/part.mp4'" >> $name.txt; done
            cat $name.txt
            ffmpeg -y -v error -f concat -safe 0 -i $name.txt -c copy $name.mp4
          done
          for l in fr en; do
            ffmpeg -y -v error -i film-$l.mp4 -i music.wav -map 0:v -map 1:a -c:v libx264 -preset medium -crf 18 -pix_fmt yuv420p -c:a aac -b:a 192k -shortest -movflags +faststart out/foldboard-demo-$l.mp4
            ffmpeg -y -v error -i wide-$l.mp4 -an -c:v libx264 -preset medium -crf 18 -pix_fmt yuv420p -r 30 -t 12 -movflags +faststart out/header-$l.mp4
            ffmpeg -y -v error -i tall-$l.mp4 -an -c:v libx264 -preset medium -crf 18 -pix_fmt yuv420p -r 30 -t 12 -movflags +faststart out/search-$l.mp4
          done
          for f in out/*.mp4; do echo "$f $(ffprobe -v error -show_entries stream=codec_type,width,height,r_frame_rate:format=duration -of csv=p=0 $f | tr '\n' ' ')"; done
          ls -la out
      - name: Publication
        run: |
          cd out
          git init -q -b ci-foldboard-video-out && git config user.name "github-actions" && git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "Vidéos Foldboard" && git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-foldboard-video-out
