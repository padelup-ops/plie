# Assemble la vidéo promo v2 (morceaux du run 42740659814) avec la musique, et la publie sur ci-foldboard-video-out.
name: Foldboard - assemblage vidéo

on:
  push:
    branches: [ci-foldboard-video-src]

permissions:
  contents: write
  actions: read

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          run-id: 42740659814
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: parts
      - name: Montage
        run: |
          sudo apt-get install -y ffmpeg >/dev/null 2>&1 || (sudo apt-get update >/dev/null && sudo apt-get install -y ffmpeg >/dev/null)
          mkdir -p out
          for l in fr en; do
            : > film-$l.txt
            for i in 0 1 2 3 4 5 6 7; do echo "file 'parts/film-$l-$i/part.mp4'" >> film-$l.txt; done
            ffmpeg -y -v error -f concat -safe 0 -i film-$l.txt -c copy film-$l.mp4
            ffmpeg -y -v error -i film-$l.mp4 -i music2.wav -map 0:v -map 1:a -c:v libx264 -preset medium -crf 18 -pix_fmt yuv420p -c:a aac -b:a 192k -shortest -movflags +faststart out/foldboard-promo-$l.mp4
          done
          ls -la out
      - name: Publication
        run: |
          cd out
          git init -q -b ci-foldboard-video-out && git config user.name "github-actions" && git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "Vidéo promo Foldboard v2" && git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-foldboard-video-out
