# DUO FOLDS (projet Clapet) : filme les scènes de la vidéo promo sur le simulateur iPhone Duo.
# L'app est lancée en mode démo (historique réaliste, charnière simulée) et l'écran est enregistré.
# Les séquences sont publiées dans la branche ci-clapet-demo.

name: Clapet - tournage vidéo

on:
  workflow_dispatch:
    inputs:
      langs:
        description: "Langues (fr en)"
        required: false
        default: "fr en"
      set:
        description: "Scènes : v2 (téléphone posé, badges, widgets) ou v1 (compteur, limite)"
        required: false
        default: "v2"

jobs:
  film:
    runs-on: xcode-27
    timeout-minutes: 75
    permissions:
      contents: write

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v5

      - name: Choisir Xcode 27.1
        run: |
          XCODE=$(ls -d /Applications/Xcode_27.1*.app 2>/dev/null | grep -v beta | head -1)
          sudo xcode-select -s "${XCODE:-/Applications/Xcode.app}"
          xcodebuild -version

      - name: Chercher le modèle 3D de l'iPhone Duo du simulateur (v6)
        if: ${{ github.event.inputs.set == 'v6' }}
        run: |
          mkdir -p rushes/modele
          X=$(xcode-select -p)/../..
          {
            echo "== Xcode : $X"
            for root in "$X" /Library/Developer /System/Library/CoreServices "$HOME/Library/Developer"; do
              find "$root" \( -iname "*.usdz" -o -iname "*.usdc" -o -iname "*.usda" -o -iname "*.scn" -o -iname "*.scnz" -o -iname "*.dae" -o -iname "*.glb" -o -iname "*.gltf" -o -iname "*.obj" -o -iname "*.reality" \) 2>/dev/null
            done | grep -v -i "/Templates/" | head -400
            echo "== devicekit chrome"
            find "$X" /Library/Developer -path "*DeviceKit*" -iname "*phone1[45]*" 2>/dev/null | head -50
            find "$X" /Library/Developer -ipath "*chrome*" -maxdepth 12 -type d 2>/dev/null | head -50
            echo "== duo"
            find "$X" /Library/Developer -ipath "*duo*" 2>/dev/null | head -100
            echo "== fold"
            find "$X" /Library/Developer -ipath "*fold*" 2>/dev/null | grep -v -i "folder" | head -100
          } > rushes/modele/liste.txt 2>&1
          # Copie des modèles 3D liés au téléphone (petits fichiers seulement)
          grep -i -E "duo|fold|hinge|phone|iphone|device" rushes/modele/liste.txt | grep -i -E "\.(usdz|usdc|usda|scn|scnz|dae|glb|gltf|obj|reality)$" | while read -r f; do
            sz=$(stat -f %z "$f" 2>/dev/null || echo 0)
            if [ "$sz" -lt 60000000 ]; then cp "$f" "rushes/modele/$(echo "$f" | md5 | cut -c1-6)-$(basename "$f")"; echo "$f -> $sz" >> rushes/modele/copies.txt; fi
          done
          # Les cadres 2D de l'iPhone Duo dans le simulateur (écran extérieur = phone15, intérieur = phone14)
          for C in phone14 phone15; do
            mkdir -p "rushes/modele/$C"
            cp -R "/Library/Developer/DeviceKit/Chrome/$C.devicechrome/Contents/Resources/." "rushes/modele/$C/" 2>/dev/null || true
          done
          cp -R "/Library/Developer/CoreSimulator/Profiles/DeviceTypes/iPhone Duo.simdevicetype/Contents/Resources/." rushes/modele/simdevicetype/ 2>/dev/null || { mkdir -p rushes/modele/simdevicetype; cp -R "/Library/Developer/CoreSimulator/Profiles/DeviceTypes/iPhone Duo.simdevicetype/Contents/Resources/." rushes/modele/simdevicetype/; }
          find rushes/modele -type f | head -100
          du -sh rushes/modele
          ls -la rushes/modele
          exit 1

      - name: Générer le projet
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen >/dev/null 2>&1 || true
          if ! command -v xcodegen >/dev/null; then
            curl -sSL -o "$RUNNER_TEMP/xcodegen.zip" https://github.com/yonaskolb/XcodeGen/releases/latest/download/xcodegen.zip
            unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xg"
            echo "$RUNNER_TEMP/xg/xcodegen/bin" >> "$GITHUB_PATH"
            export PATH="$RUNNER_TEMP/xg/xcodegen/bin:$PATH"
          fi
          if [ "${{ github.event.inputs.set }}" = "v9" ]; then
            # Écran intérieur rendu sur un simulateur iPad : l'app doit accepter l'iPad (et sans l'app Watch)
            python3 - <<'PY'
          p = 'clapet/project.yml'
          s = open(p).read()
          s = s.replace('TARGETED_DEVICE_FAMILY: "1"\n', 'TARGETED_DEVICE_FAMILY: "1,2"\n')
          s = s.replace('      - target: FoldlyWatch\n        embed: true\n', '')
          open(p, 'w').write(s)
          PY
            grep -n "TARGETED_DEVICE_FAMILY\|FoldlyWatch" clapet/project.yml | head
          fi
          cd clapet && xcodegen generate

      - name: Préparer le simulateur iPhone Duo
        run: |
          mkdir -p rushes
          find_runtime() {
            xcrun simctl list runtimes -j | python3 -c "
          import json, sys
          rs = [r for r in json.load(sys.stdin)['runtimes']
                if r.get('platform') == 'iOS' and r.get('isAvailable')
                and any('Duo' in d.get('name', '') for d in r.get('supportedDeviceTypes', []))]
          print(rs[-1]['identifier'] if rs else '')"
          }
          RUNTIME=$(find_runtime)
          if [ -z "$RUNTIME" ]; then
            xcodebuild -downloadPlatform iOS 2>&1 | tail -5
            RUNTIME=$(find_runtime)
          fi
          DEVICE_TYPE=$(xcrun simctl list devicetypes -j | python3 -c "
          import json, sys
          d = [x for x in json.load(sys.stdin)['devicetypes'] if 'Duo' in x['name']]
          print(d[0]['identifier'] if d else '')")
          echo "runtime=$RUNTIME devicetype=$DEVICE_TYPE" | tee rushes/simulateur.txt
          echo "RUNTIME=$RUNTIME" >> "$GITHUB_ENV"
          UDID=$(xcrun simctl create "Duo Folds" "$DEVICE_TYPE" "$RUNTIME")
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --wifiBars 3 --cellularBars 4 || true

      - name: Compiler et installer l'app
        run: |
          set -o pipefail
          cd clapet
          xcodebuild build -project Clapet.xcodeproj -scheme Clapet -configuration Debug \
            -sdk iphonesimulator -destination "id=$UDID" -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee ../rushes/build.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" ../rushes/build.log
          APP=build/Build/Products/Debug-iphonesimulator/Clapet.app
          xcrun simctl install "$UDID" "$APP"
          BID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist")
          echo "BID=$BID" >> "$GITHUB_ENV"
          gzip -f ../rushes/build.log

      - name: Écran intérieur sur iPad (v9)
        if: ${{ github.event.inputs.set == 'v9' }}
        run: |
          mkdir -p rushes/interieur
          # Taille en points de l'écran intérieur du Duo (2007 x 2853 pixels), d'après le profil du simulateur
          PROFILE=$(find /Library/Developer/CoreSimulator/Profiles/DeviceTypes "$(xcode-select -p)/Platforms/iPhoneOS.platform" -path "*iPhone Duo.simdevicetype/Contents/Resources/profile.plist" 2>/dev/null | head -1)
          echo "profil : $PROFILE" > rushes/interieur/profil.txt
          [ -n "$PROFILE" ] && plutil -p "$PROFILE" >> rushes/interieur/profil.txt 2>&1 || true
          read IW IH IK < <(python3 - "$PROFILE" <<'PY'
          import plistlib, sys
          found = []
          def walk(o):
              if isinstance(o, dict):
                  vals = [v for v in o.values() if isinstance(v, (int, float))]
                  if 2007 in vals or 2853 in vals:
                      sc = [v for k, v in o.items() if 'scale' in k.lower() and isinstance(v, (int, float))]
                      found.append(sc[0] if sc else None)
                  for v in o.values(): walk(v)
              elif isinstance(o, list):
                  for v in o: walk(v)
          try:
              walk(plistlib.load(open(sys.argv[1], 'rb')))
          except Exception:
              pass
          s = next((x for x in found if x), None) or 3
          w, h = round(2853 / s), round(2007 / s)
          k = min(1.0, 460 / w, 660 / h)
          print(w, h, round(k, 4))
          PY
          )
          echo "écran intérieur : ${IW}x${IH} points, échelle $IK" | tee -a rushes/interieur/profil.txt
          # Le runtime n'a pas d'iPad : le cadre de l'écran intérieur est réduit dans l'écran extérieur du Duo
          for L in ${{ github.event.inputs.langs }}; do
            LOC=fr_FR; [ "$L" = "en" ] && LOC=en_US
            for SHOT in classic:home night:home minimal:home classic:hours night:hours classic:week night:week classic:month; do
              LOOK=${SHOT%%:*}; ROOT=${SHOT##*:}
              # Intérieur : image de la fenêtre à la taille de l'écran intérieur, écrite par l'app
              xcrun simctl terminate "$UDID" "$BID" 2>/dev/null || true
              DATA=$(xcrun simctl get_app_container "$UDID" "$BID" data 2>/dev/null || true)
              rm -f "$DATA/Documents/inner.png"
              xcrun simctl launch "$UDID" "$BID" -screen home -demoSeed 1 -demoPlus 1 -demoLimit 60 -demoToday 47 -look "$LOOK" \
                -demoNoCards 1 -demoHinge "0:176,300:176" -demoDelay 0 \
                -innerSize "${IW}x${IH}" -innerRoot "$ROOT" -AppleLanguages "($L)" -AppleLocale "$LOC" > /dev/null 2>&1 || true
              for i in $(seq 1 30); do [ -f "$DATA/Documents/inner.png" ] && break; sleep 1; done
              sleep 1
              cp "$DATA/Documents/inner.png" "rushes/interieur/$L-$LOOK-$ROOT.png" 2>/dev/null || echo "pas d'image $L-$LOOK-$ROOT" >> rushes/interieur/profil.txt
              # Extérieur (Duo fermé), même état, pour les écrans d'accueil
              if [ "$ROOT" = "home" ]; then
                xcrun simctl terminate "$UDID" "$BID" 2>/dev/null || true
                xcrun simctl launch "$UDID" "$BID" -screen home -demoSeed 1 -demoPlus 1 -demoLimit 60 -demoToday 47 -look "$LOOK" \
                  -demoNoCards 1 -demoHinge "0:5,300:5" -demoDelay 0 -AppleLanguages "($L)" -AppleLocale "$LOC" > /dev/null 2>&1 || true
                sleep 7
                xcrun simctl io "$UDID" screenshot --display=1 --mask=black "rushes/interieur/$L-$LOOK-exterieur.png" > /dev/null 2>&1 || true
              fi
            done
          done
          echo "${IW} ${IH} ${IK}" > rushes/interieur/cadre.txt
          ls -la rushes/interieur

      - name: Filmer les scènes
        run: |
          # scène | écran | durée (s) | charnière simulée | autres arguments
          FOLDS="0:176,0.9:176,1.15:5,1.4:5,1.7:176,2.5:176,2.75:5,3.0:5,3.3:176,4.1:176,4.35:5,4.6:5,4.9:176,5.7:176,5.95:5,6.2:5,6.5:176"
          FOLDS3="0:176,1.4:176,2.3:4,2.9:4,3.8:176,5.6:176,6.5:4,7.1:4,8.0:176"
          DISP=1
          if [ "${{ github.event.inputs.set }}" = "v9" ]; then
          cat > scenes.txt <<EOF
          EOF
          elif [ "${{ github.event.inputs.set }}" = "v8" ]; then
          # Ouvrir le Duo par l'interface du Simulateur (boutons Closed / Partially Open / Open)
          open -a Simulator --args -CurrentDeviceUDID "$UDID" || true
          sleep 15
          screencapture -x rushes/ecran-mac-1.png || true
          osascript -e 'tell application "System Events" to tell process "Simulator" to get name of every window' > rushes/ui.txt 2>&1 || true
          osascript -e 'tell application "System Events" to tell process "Simulator" to get entire contents of front window' >> rushes/ui.txt 2>&1 || true
          osascript -e 'tell application "System Events" to tell process "Simulator" to get name of every menu item of every menu of menu bar 1' >> rushes/ui.txt 2>&1 || true
          for B in "Open" "Opened" "Unfolded"; do
            osascript -e "tell application \"System Events\" to tell process \"Simulator\" to click (first button of front window whose name is \"$B\" or description is \"$B\")" >> rushes/ui.txt 2>&1 || true
          done
          # Menu « Device » : chercher un élément Open / Unfold
          osascript -e 'tell application "System Events" to tell process "Simulator" to get name of every menu item of menu "Device" of menu bar 1' >> rushes/ui.txt 2>&1 || true
          for M in "Open" "Unfold" "Open Device" "Posture"; do
            osascript -e "tell application \"System Events\" to tell process \"Simulator\" to click menu item \"$M\" of menu \"Device\" of menu bar 1" >> rushes/ui.txt 2>&1 || true
          done
          sleep 6
          screencapture -x rushes/ecran-mac-2.png || true
          xcrun simctl launch "$UDID" "$BID" -screen home -demoSeed 1 -demoPlus 1 -demoToday 47 -look classic > /dev/null 2>&1 || true
          sleep 8
          xcrun simctl io "$UDID" screenshot --display=3 --mask=black rushes/v8-interieur.png >> rushes/ui.txt 2>&1 || true
          xcrun simctl io "$UDID" screenshot --display=1 --mask=black rushes/v8-exterieur.png >> rushes/ui.txt 2>&1 || true
          screencapture -x rushes/ecran-mac-3.png || true
          cat > scenes.txt <<EOF
          EOF
          elif [ "${{ github.event.inputs.set }}" = "v5" ]; then
          # Le Duo « ouvert » : on allume l'écran intérieur (3, LCD-1) et on éteint l'extérieur (1)
          DISP=3
          {
            echo "== power on 3"; xcrun simctl io "$UDID" screenConfig --display=3 power on 2>&1
            echo "== power off 1"; xcrun simctl io "$UDID" screenConfig --display=1 power off 2>&1
            xcrun simctl io "$UDID" enumerate 2>&1 | grep -E "Screen ID|Name:|Power" 
          } > rushes/ouverture.txt 2>&1 || true
          sleep 4
          xcrun simctl terminate "$UDID" "$BID" 2>/dev/null || true
          xcrun simctl launch "$UDID" "$BID" -screen home -demoSeed 1 -demoPlus 1 -demoToday 47 -look classic > /dev/null 2>&1 || true
          sleep 8
          xcrun simctl io "$UDID" screenshot --display=3 --mask=black rushes/test-interieur.png >> rushes/ouverture.txt 2>&1 || true
          xcrun simctl io "$UDID" screenshot --display=1 --mask=black rushes/test-exterieur.png >> rushes/ouverture.txt 2>&1 || true
          cat > scenes.txt <<EOF
          count|home|10|$FOLDS3|-demoToday 44 -look classic
          classic|home|4||-demoToday 47 -look classic
          night|home|4||-demoToday 47 -look night
          minimal|home|4||-demoToday 47 -look minimal
          week|week|6||-demoToday 47 -look classic
          widgets|widgets|5||-demoToday 47 -look classic
          history|history|5||-demoToday 47 -look classic
          open|home|6||-demoToday 46 -look classic -demoOpening 1
          EOF
          elif [ "${{ github.event.inputs.set }}" = "v4" ]; then
          # Exploration : trouver comment filmer l'écran intérieur (Duo ouvert)
          {
            echo "== simctl help io"; xcrun simctl help io 2>&1
            echo "== simctl help ui"; xcrun simctl help ui 2>&1
            echo "== simctl ui"; xcrun simctl ui "$UDID" 2>&1
            for K in posture fold hinge devicePosture; do echo "== ui $K"; xcrun simctl ui "$UDID" $K 2>&1; done
          } > rushes/exploration.txt 2>&1 || true
          xcrun simctl terminate "$UDID" "$BID" 2>/dev/null || true
          xcrun simctl launch "$UDID" "$BID" -screen home -demoSeed 1 -demoPlus 1 -demoToday 47 -look classic > /dev/null 2>&1 || true
          sleep 8
          for DSP in 0 1 2 3 4 5 internal external; do
            echo "== screenshot display $DSP" >> rushes/exploration.txt
            xcrun simctl io "$UDID" screenshot --display=$DSP --mask=black "rushes/essai-ecran-$DSP.png" >> rushes/exploration.txt 2>&1 || true
          done
          for P in open opened unfolded flat half closed; do
            for C in "ui $UDID posture $P" "ui $UDID fold $P" "io $UDID posture $P"; do
              echo "== simctl $C" >> rushes/exploration.txt
              xcrun simctl $C >> rushes/exploration.txt 2>&1 || true
            done
          done
          sleep 3
          for DSP in 0 1 2; do xcrun simctl io "$UDID" screenshot --display=$DSP --mask=black "rushes/apres-ecran-$DSP.png" >> rushes/exploration.txt 2>&1 || true; done
          cat > scenes.txt <<EOF
          EOF
          elif [ "${{ github.event.inputs.set }}" = "v3" ]; then
          # Vidéo 3 (modèle « Introducing … for iPhone Duo ») : les écrans de la version actuelle
          cat > scenes.txt <<EOF
          open|home|6||-demoToday 46 -look classic -demoOpening 1
          count|home|10|$FOLDS3|-demoToday 44 -look classic
          classic|home|4||-demoToday 47 -look classic
          night|home|4||-demoToday 47 -look night
          minimal|home|4||-demoToday 47 -look minimal
          week|week|6||-demoToday 47 -look classic
          widgets|widgets|5||-demoToday 47 -look classic
          history|history|5||-demoToday 47 -look classic
          EOF
          elif [ "${{ github.event.inputs.set }}" = "v1" ]; then
          cat > scenes.txt <<EOF
          count|home|8|$FOLDS|-demoToday 44
          limit|home|8|$FOLDS|-demoToday 57
          widgets|widgets|5||-demoToday 52
          history|history|7||-demoToday 52 -demoScroll records@3.2
          EOF
          else
          # Vidéo 2 : téléphone posé, pause, jardin et badges, widgets (look Moderne)
          cat > scenes.txt <<EOF
          phonedown|phonedown|6||-demoToday 23 -look night
          pause|pause|6||-demoToday 23 -look night
          garden|garden|6||-demoToday 23 -look night
          badge|badge|6||-demoToday 23 -look night
          widgets|widgets|5||-demoToday 23 -look night
          lock|lock|5||-demoToday 23 -look night
          gallery|widgetsGallery|6||-demoToday 23 -look night
          EOF
          fi
          xcrun simctl launch "$UDID" "$BID" > /dev/null 2>&1 || true
          sleep 6
          xcrun simctl io "$UDID" enumerate > rushes/ecrans.txt 2>&1 || true
          xcrun simctl help > rushes/simctl-aide.txt 2>&1 || true
          xcrun simctl list devicetypes -j > rushes/types.json 2>&1 || true
          for L in ${{ github.event.inputs.langs }}; do
            while IFS='|' read -r S R D HG X; do
              S=$(echo "$S" | xargs)
              [ -z "$S" ] && continue
              xcrun simctl terminate "$UDID" "$BID" 2>/dev/null || true
              DATA=$(xcrun simctl get_app_container "$UDID" "$BID" data 2>/dev/null || true)
              rm -f "$DATA/Documents/demo-origin.txt"
              sleep 1
              OUT="rushes/$L-$S.mov"
              xcrun simctl io "$UDID" recordVideo --codec=h264 --display=$DISP --mask=black --force "$OUT" 2> "rushes/$L-$S.rec.log" &
              REC=$!
              for i in $(seq 1 50); do grep -q "Recording started" "rushes/$L-$S.rec.log" && break; sleep 0.2; done
              python3 -c "import time; print('%.3f' % time.time())" > "rushes/$L-$S.recstart"
              LOC=fr_FR; [ "$L" = "en" ] && LOC=en_US
              ARGS=(-screen "$R" -demoSeed 1 -demoPlus 1 -demoLimit 60 -demoDelay 2 -AppleLanguages "($L)" -AppleLocale "$LOC")
              if [ -n "$HG" ]; then ARGS+=(-demoHinge "$HG"); fi
              ARGS+=($X)
              xcrun simctl launch "$UDID" "$BID" "${ARGS[@]}" > "rushes/$L-$S.launch.txt" 2>&1 || true
              python3 -c "import time; print('%.3f' % time.time())" > "rushes/$L-$S.launchtime"
              sleep "$D"
              # Les deux écrans en photo (pour savoir ce que montre l'écran extérieur)
              xcrun simctl io "$UDID" screenshot --display=$DISP --mask=black "rushes/$L-$S-ecran$DISP.png" > /dev/null 2>&1 || true
              sleep 8
              kill -INT $REC
              wait $REC || true
              cp "$DATA/Documents/demo-origin.txt" "rushes/$L-$S.origin" 2>/dev/null || echo "none" > "rushes/$L-$S.origin"
              ls -la "$OUT" >> rushes/fichiers.txt 2>&1 || echo "$OUT manquant" >> rushes/fichiers.txt
            done < scenes.txt
          done
          cat rushes/fichiers.txt

      - name: Voix off (macOS say)
        if: ${{ github.event.inputs.set == 'v3' }}
        run: |
          mkdir -p rushes/voix
          say -v '?' > rushes/voix/voix-disponibles.txt 2>&1 || true
          VOICE=""
          for V in "Ava (Premium)" "Zoe (Premium)" "Evan (Premium)" "Ava (Enhanced)" "Zoe (Enhanced)" "Samantha (Enhanced)" "Samantha"; do
            if grep -q "^$V " rushes/voix/voix-disponibles.txt; then VOICE="$V"; break; fi
          done
          echo "voix : ${VOICE:-défaut}" | tee rushes/voix/voix.txt
          while IFS='|' read -r ID TXT; do
            [ -z "$ID" ] && continue
            if [ -n "$VOICE" ]; then say -v "$VOICE" -r 175 -o "rushes/voix/$ID.aiff" "$TXT"; else say -r 175 -o "rushes/voix/$ID.aiff" "$TXT"; fi
            afconvert -f WAVE -d LEI16@48000 "rushes/voix/$ID.aiff" "rushes/voix/$ID.wav" && rm -f "rushes/voix/$ID.aiff"
          done < clapet/tools/video/voice-en.txt
          ls -la rushes/voix

      - name: Réduire les vidéos
        run: |
          cd rushes
          shopt -s nullglob
          for f in *.mov; do
            avconvert --source "$f" --preset Preset1920x1080 --output "${f%.mov}.mp4" --replace > /dev/null 2>&1 \
              || cp "$f" "${f%.mov}.mp4"
            rm -f "$f"
          done
          ls -la

      - name: Publier les séquences dans la branche ci-clapet-demo
        if: always()
        env:
          GH_PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd rushes
          git init -q -b ci-clapet-demo
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          echo "tournage ${{ github.run_number }} - commit ${{ github.sha }} - $(date -u)" > tournage.txt
          git add -A
          git commit -qm "Tournage Duo Folds ${{ github.run_number }}"
          git push -q -f "https://x-access-token:${GH_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-clapet-demo
