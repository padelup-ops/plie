# DUO FOLDS ou ORIGAMO : prépare la version 1.0 (fiche, captures, build) et l'envoie à la vérification d'Apple si demandé.
name: Clapet - mise en production
on:
  workflow_dispatch:
    inputs:
      build:
        description: "Numéro du build à publier"
        required: true
      submit:
        description: "1 = envoyer à la vérification d'Apple"
        required: false
        default: "0"
      withdraw:
        description: "1 = retirer la version de la vérification (rien d'autre)"
        required: false
        default: "0"
      app:
        description: "duofolds ou origamo"
        required: false
        default: "duofolds"
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
      ORIGAMO_BUNDLE_ID: ${{ secrets.BUNDLE_ID }}
      RELEASE_BUILD: ${{ inputs.build }}
      SUBMIT: ${{ inputs.submit }}
      WITHDRAW: ${{ inputs.withdraw }}
      SITE_URL: ${{ inputs.app == 'origamo' && 'https://origamo.netlify.app' || 'https://foldly.netlify.app' }}
      APP_BUNDLE: ${{ inputs.app == 'origamo' && secrets.BUNDLE_ID || 'com.padelup.clapet' }}
      BUNDLE_ID: ${{ secrets.BUNDLE_ID }}
      SHOTS_DIR: ${{ inputs.app == 'origamo' && 'tools/store_shots' || 'clapet/tools/store' }}
      CATEGORIES: ${{ inputs.app == 'origamo' && 'GAMES,GAMES_PUZZLE,GAMES_BOARD' || 'HEALTH_AND_FITNESS,UTILITIES' }}
      LISTING_JSON: ${{ inputs.app == 'origamo' && 'tools/store_listing.json' || '' }}
      APP_PRICE: ${{ inputs.app == 'origamo' && '4.99' || '' }}
    steps:
      - uses: actions/checkout@v5
      - name: Outils
        run: python3 -m pip install --quiet pyjwt cryptography
      - name: Fiche et textes
        if: inputs.withdraw != '1'
        run: |
          if [ "${{ inputs.app }}" = "origamo" ]; then
            python3 tools/asc_fiche.py 2>&1 | tee fiche.txt || true
          else
            SKIP_NOTES=1 BUILD_NUMBER=${{ inputs.build }} timeout 600 python3 clapet/tools/asc.py 2>&1 | grep -v "attente du traitement" | tee fiche.txt || true
          fi
      - name: Version 1.0
        run: |
          set -o pipefail
          python3 clapet/tools/asc_release.py 2>&1 | tee release.txt
      - name: Publier le rapport
        if: always()
        env:
          GH_PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/r" && touch fiche.txt release.txt && cp fiche.txt release.txt "$RUNNER_TEMP/r/"; cd "$RUNNER_TEMP/r"
          git init -q -b ci-clapet-release && git config user.name "github-actions" && git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "Mise en production Duo Folds" && git push -q -f "https://x-access-token:${GH_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-clapet-release
