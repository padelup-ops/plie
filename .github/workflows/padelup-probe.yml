# PADELUP : sonde ponctuelle d'un site externe depuis GitHub (le réseau de développement ne l'atteint pas).
# Ici : comment le site Anybuddy garde la session (page de connexion, cookies ou stockage local, appels d'auth).
# Résultat dans la branche ci-padelup-probe. Aucune identification, aucun contournement : lecture des pages publiques.
name: PadelUp - sonde
on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/padelup-probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Sonder Anybuddy
        run: |
          mkdir -p out && cd out
          UA="padelup-probe/1.0 (+https://github.com/padelup-ops/plie)"
          get() { curl -s -A "$UA" --max-time 25 "$@"; }
          {
          echo "== plan du site"
          get https://www.anybuddyapp.com/sitemap.xml | grep -oE '<loc>[^<]+</loc>' | head -15
          for sm in $(get https://www.anybuddyapp.com/sitemap.xml | grep -oE '<loc>[^<]+\.xml</loc>' | sed -E 's/<\/?loc>//g' | head -6); do
            echo "-- $sm"; get "$sm" | grep -oE '<loc>[^<]+</loc>' | sed -E 's/<\/?loc>//g' | grep -iE 'padel|club' | head -8
          done
          echo "== robots"; get https://www.anybuddyapp.com/robots.txt | head -30
          echo "== page de connexion"
          get https://www.anybuddyapp.com/fr/login -o login.html
          grep -oE '<(input|button|form)[^>]{0,200}>' login.html | head -20
          grep -oE '(src)="[^"]+\.js[^"]*"' login.html | sed -E 's/^src="//; s/"$//' | sort -u > ljs.txt
          wc -l ljs.txt
          echo "== indices dans les scripts de la page de connexion"
          while read -r s; do
            case "$s" in http*) url="$s" ;; /*) url="https://www.anybuddyapp.com$s" ;; *) continue ;; esac
            get "$url" -o js.txt || continue
            hits=$(grep -oE '.{0,70}(localStorage|sessionStorage|Bearer |Authorization|accessToken|access_token|refreshToken|refresh_token|setCookie|js-cookie|cookies\.set|Cookies\.set|signInWith|/auth/|/login|/token|/oauth|firebase|cognito|supabase).{0,90}' js.txt | head -12)
            [ -n "$hits" ] && { echo "--- $(basename "${url%%\?*}")"; echo "$hits"; }
          done < ljs.txt
          echo "== hôtes d'API cités"
          cat login.html | grep -oE 'https://[a-z0-9.-]+anybuddy[a-z0-9.-]*' | sort | uniq -c | sort -rn | head
          for s in $(cat ljs.txt); do case "$s" in http*) get "$s";; /*) get "https://www.anybuddyapp.com$s";; esac; done 2>/dev/null \
            | grep -oE '"https://[a-z0-9.-]*anybuddy[a-z0-9.-]*[^"]{0,60}"' | sort | uniq -c | sort -rn | head -20
          echo "== API publique (disponibilités)"
          for u in "https://api.anybuddyapp.com/v1/clubs?activity=padel&limit=1" "https://api.anybuddyapp.com/v2/clubs?limit=1" \
                   "https://www.anybuddyapp.com/api/v1/availabilities?clubSlug=4padel-bobigny&activity=padel"; do
            echo "-- $u"; get -o body.txt -w "%{http_code}\n" "$u"; head -c 300 body.txt; echo
          done
          } 2>&1 | tee resultat.txt
      - name: Publier
        if: always()
        env:
          GH_PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out && mkdir -p pub && cp resultat.txt pub/ 2>/dev/null || echo "rien" > pub/resultat.txt
          cd pub && git init -q -b ci-padelup-probe
          git config user.name "github-actions" && git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "Sonde Anybuddy"
          git push -q -f "https://x-access-token:${GH_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-padelup-probe
