# PADELUP : sonde ponctuelle d'un site externe depuis GitHub (le réseau de développement ne l'atteint pas).
# Ici : le parcours de réservation sur le site Playtomic, écran par écran (page club → terrain → heure → durée →
# suite), pour que l'assistant de l'app clique sur les bons éléments. Navigateur Chromium sans tête, identité
# par défaut (aucune usurpation), aucune connexion à un compte, rien n'est réservé. Si le site bloque : on s'arrête.
# Résultat (journal + captures) dans la branche ci-padelup-probe.
name: PadelUp - sonde
on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/padelup-probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Installer le navigateur
        run: |
          mkdir -p out && cd out
          npm init -y >/dev/null && npm i -s playwright@1.49.1
          npx playwright install --with-deps chromium >/dev/null
      - name: Parcourir le site Playtomic
        working-directory: out
        run: |
          cat > sonde.js <<'EOF'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const log = (...a) => { const l = a.join(' '); console.log(l); fs.appendFileSync('journal.txt', l + '\n'); };
          const wait = ms => new Promise(r => setTimeout(r, ms));
          function dumpJS() {
            const out = [];
            const els = document.querySelectorAll('button, a, [role], [aria-expanded], [aria-selected], [aria-pressed], [tabindex], [data-testid], input, label, select');
            for (const e of els) {
              const r = e.getBoundingClientRect();
              if (r.width === 0 || r.height === 0) continue;
              const st = getComputedStyle(e);
              if (st.visibility === 'hidden' || st.display === 'none') continue;
              const t = (e.getAttribute('aria-label') || e.innerText || e.value || '').replace(/\s+/g, ' ').trim().slice(0, 100);
              const cls = typeof e.className === 'string' ? e.className.slice(0, 60) : '';
              const attrs = ['role', 'data-testid', 'aria-expanded', 'aria-selected', 'aria-pressed', 'aria-disabled', 'type', 'name']
                .map(k => e.getAttribute(k) ? k + '=' + e.getAttribute(k) : '').filter(Boolean).join(' ');
              out.push(`${e.tagName.toLowerCase()} [${attrs}] {${cls}} y=${Math.round(r.y)} h=${Math.round(r.height)} href=${(e.getAttribute('href') || '').slice(0, 90)} :: ${t}`);
            }
            // Heures affichées : l'élément qui les porte et son ancêtre cliquable.
            const w = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT); let n, k = 0;
            while ((n = w.nextNode()) && k < 40) {
              const v = (n.nodeValue || '').trim();
              if (!/^\d{1,2}[:h]\d{2}$/.test(v)) continue;
              let el = n.parentElement, path = [];
              for (let i = 0; i < 6 && el; i++, el = el.parentElement) {
                const st = getComputedStyle(el);
                path.push(el.tagName.toLowerCase() + (el.getAttribute('role') ? '[' + el.getAttribute('role') + ']' : '') + (st.cursor === 'pointer' ? '*' : ''));
              }
              out.push('HEURE ' + v + ' <- ' + path.join(' < ')); k++;
            }
            return out;
          }
          (async () => {
            const browser = await chromium.launch();
            const ctx = await browser.newContext({ locale: 'fr-FR', timezoneId: 'Europe/Paris', viewport: { width: 390, height: 844 }, deviceScaleFactor: 1, hasTouch: true });
            const page = await ctx.newPage();
            const avail = [];
            page.on('response', async r => {
              const u = new URL(r.url());
              if (!/playtomic/.test(u.host) || /\.(js|css|png|jpg|svg|woff2?|webp|ico)$/.test(u.pathname)) return;
              log('  NET', r.request().method(), r.status(), u.host + u.pathname + (u.search ? u.search.slice(0, 220) : ''));
              if (/availability/.test(u.pathname) && r.status() === 200) { try { avail.push(await r.json()); } catch (e) {} }
            });
            page.on('framenavigated', f => { if (f === page.mainFrame()) log('PAGE →', f.url()); });
            let shot = 0;
            const snap = async (name) => {
              shot++; const f = String(shot).padStart(2, '0') + '-' + name;
              await page.screenshot({ path: f + '.png', fullPage: false }).catch(() => {});
              fs.writeFileSync(f + '.html', await page.content().catch(() => ''));
              const d = await page.evaluate(dumpJS).catch(e => ['dump: ' + e.message]);
              log('==== ' + f + ' · ' + page.url()); d.forEach(l => log('   ' + l));
            };
            const blocked = async () => {
              const t = (await page.evaluate(() => document.body ? document.body.innerText.slice(0, 2000) : '').catch(() => ''));
              return /captcha|access denied|request blocked|vérifiez que vous êtes humain|are you a robot|403 error/i.test(t);
            };
            const tomorrow = new Date(Date.now() + 86400000).toLocaleDateString('sv-SE', { timeZone: 'Europe/Paris' });

            // 1) Trouver un club de Lille avec la recherche du site.
            await page.goto('https://playtomic.com/search?q=lille', { waitUntil: 'domcontentloaded', timeout: 45000 });
            await wait(5000);
            for (const t of ['Tout accepter', 'Accepter tout', 'Accepter', 'Accept all']) {
              const b = page.getByRole('button', { name: t, exact: true }); if (await b.count()) { await b.first().click().catch(() => {}); log('cookies : ' + t); break; }
            }
            await wait(1500);
            await snap('recherche');
            if (await blocked()) { log('BLOQUÉ par le site : arrêt.'); await browser.close(); return; }
            const links = await page.$$eval('a[href*="/clubs/"]', as => [...new Set(as.map(a => a.getAttribute('href')))]);
            log('clubs trouvés :', links.slice(0, 12).join(' , '));
            const slug = (links.find(h => /lille|padel/i.test(h)) || links[0] || '/clubs/padelshot-lille').split('?')[0];

            // 2) Page du club pour demain.
            await page.goto('https://playtomic.com' + slug.replace('https://playtomic.com', '') + '?sport=PADEL&date=' + tomorrow, { waitUntil: 'domcontentloaded', timeout: 45000 });
            await wait(7000);
            await snap('club');
            if (await blocked()) { log('BLOQUÉ par le site : arrêt.'); await browser.close(); return; }

            // 3) Ouvrir une ligne de terrain (« N options · À partir de … »).
            const row = page.getByText(/\d+\s*options?/i).first();
            if (await row.count()) { await row.scrollIntoViewIfNeeded().catch(() => {}); await row.click().catch(e => log('clic terrain : ' + e.message)); await wait(2500); await snap('terrain-ouvert'); }
            else log('pas de ligne « options »');

            // 4) Toucher une heure.
            const hour = page.locator('text=/^\\s*\\d{1,2}:\\d{2}\\s*$/').first();
            if (await hour.count()) { const t = await hour.innerText().catch(() => '?'); log('heure touchée : ' + t); await hour.scrollIntoViewIfNeeded().catch(() => {}); await hour.click().catch(e => log('clic heure : ' + e.message)); await wait(2500); await snap('heure'); }
            else log('pas d\'heure cliquable');

            // 5) Choisir une durée / un prix s'il y a un choix.
            const price = page.locator('text=/\\d+([.,]\\d+)?\\s*€/').first();
            if (await price.count()) { log('prix touché : ' + (await price.innerText().catch(() => '?'))); await price.click().catch(e => log('clic prix : ' + e.message)); await wait(2500); await snap('duree'); }

            // 6) Le bouton qui fait avancer (sans compte : on regarde où il mène, rien n'est réservé).
            for (let i = 0; i < 3; i++) {
              const cta = page.getByRole('button', { name: /^(réserver|continuer|suivant|book|reserve|continue)/i }).first();
              if (!(await cta.count())) { log('pas de bouton pour avancer'); break; }
              log('bouton : ' + (await cta.innerText().catch(() => '?')));
              await cta.click().catch(e => log('clic bouton : ' + e.message));
              await wait(4000);
              await snap('suite-' + (i + 1));
              if (!/playtomic\.com\/clubs/.test(page.url())) break;
            }

            // 7) Le lien direct vers le paiement (format vu dans padel_termini), avec un vrai créneau lu plus haut.
            const blocks = avail.flat().filter(b => b && b.resource_id && Array.isArray(b.slots) && b.slots.length);
            log('blocs de disponibilités lus : ' + blocks.length);
            if (blocks.length) {
              const b = blocks[0], s = b.slots[0];
              log('exemple bloc : ' + JSON.stringify({ resource_id: b.resource_id, start_date: b.start_date, slot: s }).slice(0, 300));
              const tenant = (await page.evaluate(() => (document.documentElement.innerHTML.match(/"tenant_id"\s*:\s*"([0-9a-f-]{36})"/) || [])[1]).catch(() => null)) || b.tenant_id || '';
              const start = b.start_date.slice(0, 10) + 'T' + s.start_time.slice(0, 8) + '.000Z';
              for (const host of ['app.playtomic.com', 'playtomic.com']) {
                const u = `https://${host}/payments?` + new URLSearchParams({ type: 'CUSTOMER_MATCH', tenant_id: tenant, resource_id: b.resource_id, start, duration: String(s.duration), sport_id: 'PADEL' });
                log('LIEN DIRECT ' + u);
                await page.goto(u, { waitUntil: 'domcontentloaded', timeout: 45000 }).catch(e => log('lien : ' + e.message));
                await wait(6000);
                await snap('lien-direct-' + host.split('.')[0]);
              }
            }
            await browser.close();
          })().catch(e => { log('ERREUR ' + e.stack); process.exit(0); });
          EOF
          node sonde.js
      - name: Publier
        if: always()
        env:
          GH_PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out && mkdir -p pub && cp journal.txt *.png *.html pub/ 2>/dev/null || echo "rien" > pub/journal.txt
          cd pub && git init -q -b ci-padelup-probe
          git config user.name "github-actions" && git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "Sonde Playtomic : parcours de réservation"
          git push -q -f "https://x-access-token:${GH_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-padelup-probe
