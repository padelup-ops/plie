# PADELUP : sonde ponctuelle d'un site externe depuis GitHub (le réseau de développement ne l'atteint pas).
# Ici : comment le site Anybuddy garde la session (page de connexion, cookies ou stockage local, appels d'auth).
# Résultat dans la branche ci-padelup-probe. Aucune identification, aucun contournement : lecture des pages publiques.
name: PadelUp - sonde
on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/padelup-probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Sonder Anybuddy
        run: |
          mkdir -p out && cd out
          UA="padelup-probe/1.0 (+https://github.com/padelup-ops/plie)"
          get() { curl -s -A "$UA" --max-time 25 "$@"; }
          {
          echo "== pages club (plan du site)"
          get https://www.anybuddyapp.com/sitemap-clubs-fr.xml | grep -oE '<loc>[^<]+</loc>' | sed -E 's/<\/?loc>//g' > clubs.txt
          wc -l clubs.txt; head -5 clubs.txt; grep -iE 'lille|lomme|villeneuve|bobigny|genis|ferney|geneve' clubs.txt | head -12
          CLUB=$(grep -iE 'padel' clubs.txt | grep -iE 'lille|lomme|bobigny' | head -1); [ -z "$CLUB" ] && CLUB=$(head -1 clubs.txt)
          echo "== page club : $CLUB"
          get -D headers.txt "$CLUB" -o club.html; grep -iE "^(HTTP|set-cookie|content-type)" headers.txt | sed 's/=[^;]\{12,\}/=<valeur>/'
          wc -c club.html
          echo "-- mots-clés"
          for k in startDateTime timeSlot timeSlots availabilit slotId price duration services '"slots"' clubSlug clubId reservation booking; do
            printf "%s : %s\n" "$k" "$(grep -o "$k" club.html | wc -l)"
          done
          echo "-- extraits"
          grep -oE '.{0,160}(startDateTime|timeSlot|availabilit|slotId).{0,260}' club.html | head -8
          echo "-- liens de réservation"
          grep -oE 'href="[^"]*(reserv|booking|book|checkout|date)[^"]*"' club.html | sort -u | head -12
          echo "-- appels API dans la page"
          grep -oE '(https://api\.anybuddyapp\.com|/api/)[a-zA-Z0-9/_?=&.-]{0,80}' club.html | sort -u | head -20
          echo "== cookies posés par la page de connexion (noms seulement)"
          get -D lh.txt -o /dev/null https://www.anybuddyapp.com/fr/login; grep -i '^set-cookie' lh.txt | sed -E 's/^set-cookie: ([^=]+)=.*/\1/I'
          } 2>&1 | tee resultat.txt
      - name: Publier
        if: always()
        env:
          GH_PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out && mkdir -p pub && cp resultat.txt pub/ 2>/dev/null || echo "rien" > pub/resultat.txt
          cd pub && git init -q -b ci-padelup-probe
          git config user.name "github-actions" && git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "Sonde Anybuddy"
          git push -q -f "https://x-access-token:${GH_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-padelup-probe
