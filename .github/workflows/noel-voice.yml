# ALLÔ PÈRE NOËL : la voix du Père Noël, enregistrée d'avance (noel/tools/voice.py).
# Chatterbox Multilingual (MIT) calé sur le Père Noël de dessin animé de Kokoro (am_santa, Apache 2.0), sur les
# machines de GitHub (processeur). Chaque phrase est réécoutée par un modèle de transcription avant d'être gardée.
#   pilot : quelques phrases par langue avec plusieurs réglages (branche ci-noel-voice-pilot) ;
#   full  : tout ce qui manque dans noel/Resources/Audio/voice, par langue et par lot (branche ci-noel-voice).
# Lancé à la main, ou en modifiant noel/tools/voice-run.txt (première ligne : « pilot » ou « full », puis les langues).
name: Noël - voix du Père Noël

on:
  push:
    branches: [claude/optimistic-meitner-atx9mq]
    paths:
      - "noel/tools/voice-run.txt"
  workflow_dispatch:
    inputs:
      mode:
        description: "pilot ou full"
        required: false
        default: "full"
      langs:
        description: "Langues (fr en es de it pt)"
        required: false
        default: "fr en es de it pt"
      shards:
        description: "Machines par langue (deux fabrications par machine)"
        required: false
        default: "2"
      limit:
        description: "Essai rapide : nombre de phrases par fabrication (0 = tout)"
        required: false
        default: "0"
      minutes:
        description: "Temps de fabrication par machine (minutes)"
        required: false
        default: "210"
      branch:
        description: "Branche des résultats"
        required: false
        default: "ci-noel-voice"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
      mode: ${{ steps.m.outputs.mode }}
    steps:
      - uses: actions/checkout@v5
      - id: m
        env:
          IN_MODE: ${{ inputs.mode }}
          IN_LANGS: ${{ inputs.langs }}
          IN_SHARDS: ${{ inputs.shards }}
        run: |
          python3 - <<'EOF'
          import json, os
          lines = open("noel/tools/voice-run.txt").read().split("\n")
          words = lines[0].split()
          mode = os.environ.get("IN_MODE") or (words[0] if words else "pilot")
          langs = (os.environ.get("IN_LANGS") or " ".join(words[1:]) or "fr en es de it pt").split()
          # Machines par langue : un nombre pour toutes, ou un par langue (« 3 3 3 3 2 2 »).
          raw = (os.environ.get("IN_SHARDS") or (lines[1] if len(lines) > 1 else "") or "2").split()
          per = [int(x) for x in raw if x.isdigit()] or [2]
          count = {l: (per[i] if i < len(per) else per[-1]) for i, l in enumerate(langs)}
          if mode == "pilot":
              count = {l: 1 for l in langs}
          m = [{"lang": l, "shard": i, "of": count[l]} for l in langs for i in range(count[l])]
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("matrix=" + json.dumps({"include": m}) + "\n")
              f.write("mode=" + mode + "\n")
          print(mode, len(m), "lots")
          EOF
          python3 noel/tools/voice.py plan

  gen:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 270
    strategy:
      fail-fast: false
      # Pas toutes les machines du compte : les autres apps doivent pouvoir compiler pendant ce temps.
      max-parallel: 16
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installer
        run: |
          sudo apt-get update -qq > /dev/null
          sudo apt-get install -y -qq espeak-ng ffmpeg > /dev/null
          pip install -q --extra-index-url https://download.pytorch.org/whl/cpu chatterbox-tts 2>&1 | tail -2
          pip install -q faster-whisper soundfile 2>&1 | tail -2
          if [ ! -f noel/ai/santa-voice-ref.wav ]; then
            pip install -q --extra-index-url https://download.pytorch.org/whl/cpu kokoro 2>&1 | tail -2
          fi
          python -c "import torch; print('torch', torch.__version__, torch.get_num_threads(), 'fils')"
      - name: Voix
        env:
          MODE: ${{ needs.plan.outputs.mode }}
          LANG_CODE: ${{ matrix.lang }}
          SHARD: ${{ matrix.shard }}
          OF: ${{ matrix.of }}
          LIMIT: ${{ inputs.limit || '0' }}
          MINUTES: ${{ inputs.minutes || '210' }}
        run: |
          mkdir -p out
          if [ "$MODE" = pilot ]; then
            python noel/tools/voice.py pilot --lang "$LANG_CODE" --out out 2>&1 | grep -v -i "warn" | tee out/log-$LANG_CODE.txt
          else
            # Deux fabrications en parallèle sur la machine (deux fils chacune), chacune son lot.
            export VOICE_THREADS=2 OMP_NUM_THREADS=2 MKL_NUM_THREADS=2
            A=$((SHARD * 2)); B=$((SHARD * 2 + 1)); N=$((OF * 2))
            python noel/tools/voice.py gen --lang "$LANG_CODE" --shard "$A/$N" --out out --minutes "$MINUTES" --limit "$LIMIT" 2>&1 | grep -v -i "warn" > out/log-$LANG_CODE-$A.txt &
            python noel/tools/voice.py gen --lang "$LANG_CODE" --shard "$B/$N" --out out --minutes "$MINUTES" --limit "$LIMIT" 2>&1 | grep -v -i "warn" > out/log-$LANG_CODE-$B.txt &
            wait
            tail -n 40 out/log-$LANG_CODE-$A.txt out/log-$LANG_CODE-$B.txt
          fi
          find out -name "*.try*" -delete
          du -sh out; find out -name "*.m4a" | wc -l
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voice-${{ matrix.lang }}-${{ matrix.shard }}
          path: out
          retention-days: 5

  collect:
    needs: [plan, gen]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: parts
      - name: Publier
        env:
          GH_PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODE: ${{ needs.plan.outputs.mode }}
          BRANCH: ${{ inputs.branch || 'ci-noel-voice' }}
        run: |
          mkdir -p out
          for d in parts/*/; do cp -R "$d". out/ 2>/dev/null || true; done
          cd out
          cat report-*.jsonl > report.jsonl 2>/dev/null || true
          python3 - <<'EOF'
          import json, os, glob
          rows = [json.loads(l) for l in open("report.jsonl")] if os.path.exists("report.jsonl") else []
          if rows:
              ok = sum(r["ok"] for r in rows)
              print(f"{ok}/{len(rows)} phrases gardées, {sum(r['dur'] for r in rows if r['ok']) / 60:.0f} min de voix")
              with open("faibles.txt", "w") as f:
                  for r in rows:
                      if not r["ok"]:
                          f.write(f"{r['id']} {r['score']} {r['dur']}s | {r['text']} | {r['heard']}\n")
          for p in sorted(glob.glob("pilot-*.json")):
              print(p)
          EOF
          BR="$BRANCH"; [ "$MODE" = pilot ] && BR=ci-noel-voice-pilot
          git init -q -b "$BR"
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "Voix du Père Noël ($MODE)" && git push -q -f "https://x-access-token:${GH_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$BR"
