# HEXFOLD : construit le jeu Unciv (MPL-2.0, github.com/yairm210/Unciv) pour navigateur (cible web TeaVM du projet),
# à un commit fixé, et le dépose sur la branche ci-hexfold-web. L'app iOS l'embarque tel quel (WKWebView, hors ligne).
# Le code source d'Unciv reste celui du projet d'origine ; nos modifications éventuelles sont dans hexfold/patches (publiques).
name: Hexfold - jeu web
on:
  workflow_dispatch:
    inputs:
      commit:
        description: "Commit d'Unciv"
        required: false
        default: "ab727f27fb43f435621eccfc88e99fd61aef32e9"
jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with: { path: plie }
      - uses: actions/checkout@v5
        with:
          repository: yairm210/Unciv
          ref: ${{ inputs.commit }}
          path: unciv
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '9.6.1' }
      - name: Nos retouches (s'il y en a)
        run: |
          cd unciv
          for p in ../plie/hexfold/patches/*.patch; do [ -f "$p" ] && git apply "$p" && echo "appliqué $p"; done || true
      - name: Construire
        run: |
          cd unciv
          set -o pipefail
          gradle -Pweb -PwebCompilerMemory=8192 '-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1g' \
            :web:preparePages --max-workers=2 --no-daemon --console=plain -Pkotlin.compiler.execution.strategy=in-process 2>&1 | tail -40
          node --check web/build/pages/game/app.js
          git rev-parse HEAD > web/build/pages/game/SOURCE_COMMIT
          du -sh web/build/pages/game; ls web/build/pages/game | head -40
          find web/build/pages/game -size +90M -print
      - name: Publier
        run: |
          cd unciv/web/build/pages/game
          git init -q -b ci-hexfold-web
          git config user.name github-actions && git config user.email actions@github.com
          git add -A && git commit -qm "Unciv web $(cat SOURCE_COMMIT)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-hexfold-web
