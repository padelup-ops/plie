# UNLOCKED : des histoires de téléphones trouvés. Un jeu d'enquête dans un faux téléphone (tout iPhone, plus sur iPhone Duo).
# Projet Xcode généré par XcodeGen sur le Mac de GitHub : `xcodegen generate` dans ce dossier.
name: Unlocked
options:
  bundleIdPrefix: com.padelup
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    LOCALIZATION_PREFERS_STRING_CATALOGS: NO
targets:
  Unlocked:
    type: application
    platform: iOS
    sources:
      - path: Unlocked
    info:
      path: Unlocked/Info.plist
      properties:
        CFBundleDisplayName: Unlocked
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, fr]
        CFBundleAllowMixedLocalizations: true
        UILaunchScreen: {}
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.padelup.unlocked
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme: {}
