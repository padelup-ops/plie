databases:
  - name: padelup-db
    plan: free
    databaseName: padelup
    user: padelup

services:
  - type: web
    name: padelup-api
    plan: free
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn backend.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: padelup-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: BOT_ENCRYPTION_KEY
        sync: false
      - key: BOT_CRON_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_IDS
        sync: false
      - key: DEBUG
        value: "false"
      - key: PYTHON_VERSION
        value: "3.11.6"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"

  # Bot de réservation 24 h/24 (service payant chez Render). Sans lui : un cron externe gratuit
  # (cron-job.org...) appelle POST https://<api>/api/bot/tick/ chaque minute avec l'en-tête X-Bot-Secret.
  - type: worker
    name: padelup-booking-bot
    plan: starter
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python manage.py run_booking_bot --loop --interval 60"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: padelup-db
          property: connectionString
      - key: SECRET_KEY
        sync: false
      - key: BOT_ENCRYPTION_KEY
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.6"
