<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{margin:0;height:100%;font-family:-apple-system,system-ui}
.map{position:absolute;inset:0;background:#e9efe3;overflow:hidden}
.w{position:absolute;border-radius:50%;background:#b8d6e8}
.f{position:absolute;border-radius:40%;background:#cfe0bf}
.r{position:absolute;height:6px;background:#fff;border-radius:3px;box-shadow:0 0 0 1px #d8d8d0}
.trail{position:absolute;inset:0}
.pin{position:absolute;width:26px;height:26px;margin:-26px 0 0 -13px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:#e5533d;box-shadow:0 3px 8px rgba(0,0,0,.3)}
.card{position:absolute;left:12px;right:12px;bottom:14px;background:#fff;border-radius:16px;padding:14px 16px;box-shadow:0 6px 24px rgba(0,0,0,.18)}
.card b{font-size:17px}.card .m{color:#666;font-size:13px;margin-top:4px}
.stats{display:flex;gap:16px;margin-top:10px;font-size:13px}.stats div b{display:block;font-size:16px}
</style></head><body><div class="map">
<div class="f" style="left:-10%;top:5%;width:70%;height:45%"></div><div class="f" style="left:50%;top:40%;width:65%;height:40%"></div>
<div class="w" style="left:55%;top:8%;width:38%;height:22%"></div>
<div class="r" style="left:-5%;top:58%;width:120%;transform:rotate(-12deg)"></div>
<div class="r" style="left:30%;top:20%;width:70%;transform:rotate(70deg)"></div>
<svg class="trail" viewBox="0 0 100 100" preserveAspectRatio="none"><path d="M18 70 C30 55,28 40,42 35 S62 30,70 18" fill="none" stroke="#e5533d" stroke-width="1.2" stroke-dasharray="2 1.4"/></svg>
<div class="pin" style="left:18%;top:70%"></div><div class="pin" style="left:70%;top:18%;background:#1d7a5f"></div>
<div class="card"><b>Lakeside ridge loop</b><div class="m">Trail Maps · Moderate · Loop trail</div>
<div class="stats"><div><b>9.4 km</b>distance</div><div><b>420 m</b>climb</div><div><b>3 h 10</b>walking</div></div></div>
</div></body></html>
