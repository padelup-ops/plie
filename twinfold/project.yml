# TWINFOLD : le navigateur à deux pages pour l'iPhone Duo (et tout iPhone).
# Projet généré par XcodeGen : `xcodegen generate` dans ce dossier.
name: Twinfold
options:
  bundleIdPrefix: com.padelup
  developmentLanguage: en
  deploymentTarget:
    iOS: "27.1"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: 1.1.2
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    LOCALIZATION_PREFERS_STRING_CATALOGS: NO
targets:
  Twinfold:
    type: application
    platform: iOS
    sources:
      - path: App
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Twinfold
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, fr, de, es, it, ja]
        CFBundleAllowMixedLocalizations: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        ITSAppUsesNonExemptEncryption: false
        NSFaceIDUsageDescription: Twinfold uses Face ID to unlock your private tabs.
        # Le son des vidéos continue en image dans l'image et écran verrouillé.
        UIBackgroundModes: [audio]
        # Les téléchargements vont dans Fichiers › Sur mon iPhone › Twinfold.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        CFBundleURLTypes:
          - CFBundleURLName: com.padelup.twinfold
            CFBundleURLSchemes: [twinfold]
        CFBundleIcons:
          CFBundlePrimaryIcon:
            CFBundleIconName: AppIcon
          CFBundleAlternateIcons:
            AppIconNight:
              CFBundleIconName: AppIconNight
            AppIconSplit:
              CFBundleIconName: AppIconSplit
            AppIconMint:
              CFBundleIconName: AppIconMint
            AppIconFold:
              CFBundleIconName: AppIconFold
        "CFBundleIcons~ipad":
          CFBundlePrimaryIcon:
            CFBundleIconName: AppIcon
          CFBundleAlternateIcons:
            AppIconNight:
              CFBundleIconName: AppIconNight
            AppIconSplit:
              CFBundleIconName: AppIconSplit
            AppIconMint:
              CFBundleIconName: AppIconMint
            AppIconFold:
              CFBundleIconName: AppIconFold
    entitlements:
      path: App/Twinfold.entitlements
      properties:
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)$(CFBundleIdentifier)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.padelup.twinfold
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: "YES"
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIconNight AppIconSplit AppIconMint AppIconFold"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    scheme: {}
