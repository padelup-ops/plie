# TWINFOLD : le navigateur à deux pages pour l'iPhone Duo (et tout iPhone).
# Projet généré par XcodeGen : `xcodegen generate` dans ce dossier.
name: Twinfold
options:
  bundleIdPrefix: com.padelup
  developmentLanguage: en
  deploymentTarget:
    iOS: "27.1"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    LOCALIZATION_PREFERS_STRING_CATALOGS: NO
targets:
  Twinfold:
    type: application
    platform: iOS
    sources:
      - path: App
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Twinfold
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, fr, de, es, it, ja]
        CFBundleAllowMixedLocalizations: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        CFBundleURLTypes:
          - CFBundleURLName: com.padelup.twinfold
            CFBundleURLSchemes: [twinfold]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.padelup.twinfold
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    scheme: {}
