<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD23F"/>
      <stop offset="0.55" stop-color="#FF8A3D"/>
      <stop offset="1" stop-color="#FF4F7B"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2B3166"/>
      <stop offset="1" stop-color="#151935"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7DF9FF"/>
      <stop offset="1" stop-color="#3DB8FF"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#9FFBFF" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#9FFBFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <g transform="translate(488 525) scale(1.04) translate(-470 -470)">
  <!-- petits traits de mouvement : « clap ! » -->
  <g stroke="#FFFFFF" stroke-width="30" stroke-linecap="round" opacity="0.9">
    <line x1="830" y1="300" x2="900" y2="250"/>
    <line x1="868" y1="420" x2="955" y2="410"/>
    <line x1="835" y1="540" x2="905" y2="585"/>
  </g>
  <!-- lueur de l'écran intérieur, dans la bouche -->
  <ellipse cx="560" cy="560" rx="270" ry="150" fill="url(#glow)"/>
  <!-- moitié basse -->
  <g transform="rotate(-6 250 640)">
    <rect x="200" y="640" width="600" height="96" rx="48" fill="url(#body)"/>
    <rect x="255" y="626" width="520" height="30" rx="15" fill="url(#screen)"/>
  </g>
  <!-- langue -->
  <path d="M300 615 Q420 560 520 610 Q440 660 300 640 Z" fill="#FF5C8A"/>
  <!-- moitié haute, ouverte comme une mâchoire -->
  <g transform="rotate(-34 250 620)">
    <rect x="200" y="530" width="600" height="96" rx="48" fill="url(#body)"/>
    <rect x="255" y="610" width="520" height="30" rx="15" fill="url(#screen)"/>
    <!-- les yeux, posés sur le dessus -->
    <circle cx="560" cy="505" r="78" fill="#FFFFFF"/>
    <circle cx="710" cy="505" r="78" fill="#FFFFFF"/>
    <circle cx="580" cy="512" r="36" fill="#151935"/>
    <circle cx="730" cy="512" r="36" fill="#151935"/>
    <circle cx="592" cy="498" r="11" fill="#FFFFFF"/>
    <circle cx="742" cy="498" r="11" fill="#FFFFFF"/>
  </g>
  <!-- la charnière -->
  <circle cx="232" cy="628" r="62" fill="url(#body)"/>
  <circle cx="232" cy="628" r="22" fill="#FFD23F"/>
  </g>
</svg>
